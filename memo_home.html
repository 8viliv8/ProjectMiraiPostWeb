<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H°me</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<meta name="apple-mobile-web-app-title" content="H°me">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFAF8;
    --surface:#FFFFFF;
    --border:#EAE7E1;
    --ink:#2C2E31;
    --dim:#8E8B82;
    --accent:#6E9BB8;
    --mono:'JetBrains Mono',monospace;
    --ui:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;

    --idea:#A8757F;
    --nichijo:#6E828C;
    --kaji:#7C8A6E;
    --shigoto:#8C7A5C;
  }
  /* ページ間の行き来を、対応ブラウザ(Chrome/Edge最新版・Safari 18.2以降)でクロスフェードにする。
     未対応の環境では、これまで通り普通の画面切り替えになるだけで、悪化はしない。 */
  @view-transition{ navigation: auto; }
  *{box-sizing:border-box}
  button, input, textarea{-webkit-appearance:none;appearance:none;font:inherit}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--ui);
    min-height:100vh;
  }
  .wrap{max-width:640px;margin:0 auto;padding:36px 20px 100px}

  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:28px}
  header h1{font-size:15px;font-weight:500;letter-spacing:.02em;margin:0}
  header h1 span{color:var(--dim);font-weight:400;font-size:12px;margin-left:8px}
  .bubble-icon{vertical-align:-2px;color:var(--dim)}
  .fish-icon{vertical-align:-1px;color:var(--dim);margin-left:6px}
  .tankFrame{
    display:inline-block;border:1px solid var(--border);border-radius:3px;
    padding:3px 10px;
  }
  .tank-icon{vertical-align:-2px;color:var(--dim);margin:0 2px}

  #universeLink{
    font-family:var(--mono);font-size:11px;letter-spacing:.05em;
    color:var(--dim);text-decoration:none;border:1px solid var(--border);
    border-radius:6px;padding:6px 12px;transition:.2s;
  }
  #universeLink:hover{color:var(--ink);border-color:var(--accent);background:var(--surface)}
  @keyframes bubbleBlink{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.4)} }
  #noteCircle.blink{ animation: bubbleBlink .22s ease-in-out; }

  /* ---------- 入力欄：ウィンドウ風カード（白基調） ---------- */
  #inputCard{
    background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;
    box-shadow:0 12px 30px -18px rgba(0,0,0,.12);
    margin-bottom:34px;
  }
  #inputCard .bar{
    display:flex;align-items:center;justify-content:space-between;gap:6px;
    padding:10px 12px;background:#EFEDE7;border-bottom:1px solid var(--border);
  }
  #inputCard .barLeft{display:flex;align-items:center}
  #inputCard .barRight{display:flex;align-items:center;gap:6px}
  #noteCircle{
    width:12px;height:12px;border-radius:50%;
    border:1.6px solid var(--dim);background:transparent;
    transition:background .2s,border-color .2s;
  }
  #inputCard .dot{
    width:9px;height:9px;border-radius:50%;cursor:pointer;transition:transform .15s;
    padding:7px;background-clip:content-box;box-sizing:content-box;
    display:inline-flex;align-items:center;justify-content:center;
  }
  #inputCard .dot:hover{transform:scale(1.15)}
  #inputCard .dot.r{background:#B37D6E}
  #inputCard .dot.y{background:#C4A05A}
  #inputCard .dot.g{background:#7C9575}
  #inputCard .dot.b{background:#7B93B0}
  #inputCard .dot.active{box-shadow:0 0 0 3px rgba(0,0,0,.08)}
  #clearTemplate{
    display:none;font-family:var(--mono);font-size:10px;color:var(--dim);
    cursor:pointer;margin-left:8px;white-space:nowrap;flex:none;
  }
  #saveTemplate{
    display:inline-flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:10px;color:var(--ink);
    background:#fff;border:1px solid var(--accent);border-radius:999px;
    padding:4px 12px;cursor:pointer;margin-left:8px;transition:transform .15s,background .15s;
    white-space:nowrap;flex:none;
  }
  #saveTemplate:hover{transform:scale(1.05);background:var(--surface)}
  #inputCard.expanded #clearTemplate{display:inline}
  #inputCard.collapsed textarea{min-height:20px!important;max-height:20px;overflow:hidden}
  #inputCard.expanded textarea{min-height:120px}
  #inputCard.expanded #memoInput{min-height:80px}

  /* ---------- スマホ幅では、テンプレート使用中だけ全画面に広げる ---------- */
  @media (max-width: 600px){
    #inputCard .dot{padding:9px}
    #inputCard.expanded{
      position:fixed;inset:0;z-index:50;border-radius:0;
      display:flex;flex-direction:column;overflow-y:auto;
    }
    #inputCard.expanded .body{flex:1;padding-bottom:40px}
  }

  /* ---------- 構造化フィールド：ラベルは固定・編集不可（罫線扱い） ---------- */
  #structuredFields{
    display:none;
    margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);
  }
  #inputCard.expanded #structuredFields{display:block}
  .field{margin-bottom:14px}
  .field:last-child{margin-bottom:0}
  .flabel{
    font-family:var(--mono);font-size:10px;letter-spacing:.12em;
    color:#B4B0A6;user-select:none;pointer-events:none;
    margin-bottom:4px;
  }
  .field input, .field textarea{
    width:100%;border:none;outline:none;resize:none;background:transparent;
    font-family:var(--ui);font-size:13px;color:var(--ink);line-height:1.7;
  }
  .field input::placeholder, .field textarea::placeholder{color:#C7C3B8}
  #inputCard .body{padding:16px 18px 18px}
  #inputCard .prompt{
    display:flex;gap:10px;align-items:flex-start;
    font-family:var(--mono);font-size:13px;color:var(--ink);
  }
  #inputCard .prompt::before{content:'';}
  #inputCard textarea{
    flex:1;background:transparent;border:none;outline:none;resize:none;
    color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.7;
    min-height:22px;max-height:180px;
  }
  @media (max-width: 600px){
    /* iOSは16px未満の入力欄をタップすると自動でズームしてしまうため、
       スマホ幅の時だけ16pxに引き上げてズームを防ぐ */
    #inputCard textarea, #inputCard input,
    #structuredFields textarea, #structuredFields input{
      font-size:16px !important;
    }
  }
  #inputCard textarea::placeholder{color:#B4B0A6}
  #inputCard .foot{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:10px;font-family:var(--mono);font-size:10px;color:var(--dim);
  }
  #inputCard button{
    font-family:var(--mono);font-size:11px;letter-spacing:.05em;
    background:var(--accent);color:#fff;border:none;border-radius:5px;
    padding:6px 14px;cursor:pointer;transition:opacity .2s;
  }
  #inputCard button:hover{opacity:.85}
  #inputCard button:disabled{opacity:.35;cursor:default}

  /* ---------- 認証 ---------- */
  #authRow{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin:-16px 0 20px;font-size:11px;color:var(--dim)}
  #authRow button{
    -webkit-appearance:none;appearance:none;font:inherit;
    font-family:var(--ui);font-size:11px;color:var(--dim);
    background:none;border:1px solid var(--border);border-radius:6px;
    padding:5px 12px;cursor:pointer;
  }
  #authRow button:hover{border-color:var(--accent);color:var(--ink)}
  #authWho{
    cursor:pointer;display:flex;align-items:center;gap:6px;
    background:var(--surface);border:1px solid var(--accent);border-radius:999px;
    padding:5px 12px;color:var(--ink);
  }
  #authWho::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}

  /* ---------- 一覧 ---------- */
  #list{display:flex;flex-direction:column;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .card{
    background:var(--surface);padding:16px 18px;cursor:default;
    display:flex;flex-direction:column;gap:6px;
  }
  .card .row1{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .card .row1 .left{display:flex;align-items:center;gap:9px;min-width:0}
  .card .titleCircle{width:9px;height:9px;border-radius:50%;flex:none}
  .card .title{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .sub{font-size:12px;color:var(--dim);line-height:1.6}
  .card .meta{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:9.5px;color:var(--dim)}
  .qtag{
    display:inline-flex;align-items:center;gap:5px;
    border:1px solid var(--border);border-radius:999px;
    padding:2px 9px;font-family:var(--mono);font-size:9.5px;color:var(--dim);
    cursor:pointer;user-select:none;background:#fff;
  }
  .qtag i{width:6px;height:6px;border-radius:50%}
  .qtag[data-q="idea"] i{background:var(--idea)}
  .qtag[data-q="nichijo"] i{background:var(--nichijo)}
  .qtag[data-q="kaji"] i{background:var(--kaji)}
  .qtag[data-q="shigoto"] i{background:var(--shigoto)}

  .qmenu{position:absolute;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 12px 30px -10px rgba(0,0,0,.25);overflow:hidden;z-index:20;display:none}
  .qmenu.open{display:block}
  .qmenu div{padding:7px 14px;font-family:var(--mono);font-size:11px;display:flex;align-items:center;gap:8px;cursor:pointer}
  .qmenu div:hover{background:var(--bg)}
  .qmenu i{width:6px;height:6px;border-radius:50%}
  .qmenu i.circleIcon{background:none;border:1px solid var(--dim)}

  /* ---------- カスタムダイアログ（prompt/confirmの置き換え） ---------- */
  #dialogOverlay{
    position:fixed;inset:0;background:rgba(251,250,248,.75);
    display:none;align-items:center;justify-content:center;z-index:60;
    backdrop-filter:blur(2px);
  }
  #dialogOverlay.open{display:flex}
  #dialogBox{
    width:min(320px,88vw);background:var(--surface);border:1px solid var(--border);
    border-radius:10px;padding:20px;box-shadow:0 30px 70px -20px rgba(0,0,0,.25);
  }
  #dialogMessage{font-size:13px;color:var(--ink);line-height:1.7;margin-bottom:14px}
  #dialogInput{
    width:100%;border:1px solid var(--border);border-radius:6px;
    padding:8px 10px;font-family:var(--ui);font-size:13px;color:var(--ink);
    outline:none;margin-bottom:14px;background:#fff;
  }
  #dialogActions{display:flex;justify-content:flex-end;gap:8px}
  #dialogActions button{
    font-family:var(--mono);font-size:11px;color:var(--dim);background:none;
    border:1px solid var(--border);border-radius:6px;padding:6px 14px;cursor:pointer;
  }
  #dialogOk{color:#fff!important;background:var(--accent)!important;border-color:var(--accent)!important}

  /* ---------- プール詳細（タイトルクリックで開く） ---------- */
  #poolOverlay{
    position:fixed;inset:0;background:rgba(251,250,248,.85);
    display:none;align-items:center;justify-content:center;z-index:55;
    backdrop-filter:blur(2px);
  }
  #poolOverlay.open{display:flex}
  #poolPanel{
    width:min(480px,92vw);max-height:80vh;overflow:auto;
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
    box-shadow:0 30px 70px -20px rgba(0,0,0,.25);
  }
  .poolHeader{
    display:flex;align-items:center;gap:10px;padding:14px 16px;
    border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);
  }
  #poolNameInput{
    flex:1;border:none;outline:none;background:transparent;
    font-family:var(--ui);font-size:14px;font-weight:500;color:var(--ink);
    padding:6px 4px;border-bottom:1px dashed transparent;
  }
  #poolNameInput:focus{border-bottom:1px dashed var(--accent)}
  #poolCloseBtn{font-family:var(--mono);font-size:11px;color:var(--dim);cursor:pointer;padding:6px 4px}
  #poolDeleteBtn{font-family:var(--mono);font-size:11px;color:#B15C4F;cursor:pointer;padding:6px 4px}
  #poolAutoBtn{font-family:var(--mono);font-size:11px;color:var(--accent);cursor:pointer;padding:6px 4px}
  #poolAutoBtnInline{
    position:absolute;right:10px;bottom:8px;
    font-family:var(--mono);font-size:9px;color:var(--accent);
    border:1px solid var(--border);border-radius:999px;
    padding:3px 9px;cursor:pointer;background:#fff;
  }
  #poolAutoBtnInline:hover{border-color:var(--accent)}
  #poolNoteList{padding:8px 16px 20px}
  .poolItem{padding:12px 0;border-bottom:1px solid var(--border)}
  .poolItem .piTop{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .poolItem .piTitle{font-size:13px;color:var(--ink)}
  .poolItem .piDate{font-family:var(--mono);font-size:10px;color:var(--dim);white-space:nowrap}
  .poolItem select{
    margin-top:8px;width:100%;font-family:var(--ui);font-size:12px;color:var(--dim);
    border:1px solid var(--border);border-radius:6px;padding:6px 8px;background:#fff;
  }
  #poolEmpty{color:var(--dim);font-size:12px;text-align:center;padding:30px 0}

  #empty{color:var(--dim);font-size:12px;text-align:center;padding:60px 0}

  .card{cursor:pointer}
  .card:hover{background:#F5F3EE}

  /* ---------- 保存時：ひとつの〇に収束するエフェクト ---------- */
  .converge-dot{
    position:fixed;z-index:60;border-radius:50%;
    background:var(--idea);
    pointer-events:none;
    transition:all .55s cubic-bezier(.3,.7,.2,1);
  }

  /* ---------- カードが「編集中」の時だけ出す削除リンク ---------- */
  #cardDelete{display:none;font-family:var(--mono);font-size:10px;color:#B15C4F;cursor:pointer;letter-spacing:.05em}
  #inputCard.editing #cardDelete{display:inline}
  #inputCard.editing .barLeft::after{content:'編集中';font-family:var(--mono);font-size:9px;color:var(--dim);margin-left:8px;letter-spacing:.1em}

  /* ---------- 分類 ---------- */
  #classifySection{margin-top:56px;padding-top:28px;border-top:1px solid var(--border)}
  #pool{
    width:100%;min-height:70px;
    background:var(--surface);border:1px dashed var(--border);border-radius:10px;
    padding:12px 16px;margin-bottom:14px;
    display:flex;flex-direction:column;
    transition:border-color .2s,background .2s;
  }
  #poolsRow{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
  #categories{display:contents}
  .dropzone{
    background:var(--surface);border:1px dashed var(--border);border-radius:10px;
    padding:12px 14px;min-width:120px;min-height:90px;
    display:inline-flex;flex-direction:column;
    transition:border-color .2s,background .2s;
  }
  .dropzone.dragover, #pool.dragover{border-color:var(--accent);background:#F0EEE8}
  .czlabel{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--dim);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:14px}
  .czlabel .catname{color:var(--ink);font-family:var(--ui);font-size:12px;font-weight:500;letter-spacing:0}
  .dots{display:flex;flex-wrap:wrap;align-content:flex-start;gap:10px;flex:1}
  .zdot{
    width:14px;height:14px;border-radius:50%;cursor:grab;
    border:1.5px solid rgba(0,0,0,.15);
    transition:transform .15s;
  }
  .zdot:hover{transform:scale(1.25)}
  .zdot.dragging{opacity:.3}
  #btnAddCategory{
    align-self:flex-start;
    font-family:var(--mono);font-size:11px;color:var(--dim);
    background:none;border:1px solid var(--border);border-radius:6px;
    padding:7px 14px;cursor:pointer;
  }
  #btnAddCategory:hover{border-color:var(--accent);color:var(--ink)}
  .catDelete{cursor:pointer;color:var(--dim);font-family:var(--mono);font-size:10px}
  .catDelete:hover{color:#B15C4F}

  /* ---------- 折りたたみ式の一覧 ---------- */
  /* ---------- 常時表示の検索バー（控えめに） ---------- */
  #searchBarWrap{
    position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
    z-index:40;width:min(280px,80vw);
    opacity:.5;transition:opacity .2s;
  }
  #searchBarWrap:focus-within, #searchBarWrap:hover{opacity:1}
  #searchInput{
    width:100%;font-family:var(--mono);font-size:11px;color:var(--ink);
    background:var(--surface);border:1px solid var(--border);border-radius:999px;
    padding:6px 14px;outline:none;box-shadow:0 4px 14px -6px rgba(0,0,0,.15);
  }
  #searchInput:focus{border-color:var(--accent)}
  #searchInput::placeholder{color:var(--dim)}

  #listToggle{
    margin-top:40px;padding-top:20px;border-top:1px solid var(--border);
    font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.05em;
    cursor:pointer;user-select:none;
  }
  #listToggle:hover{color:var(--ink)}
  #listSection{display:none;margin-top:16px}
  #listSection.open{display:block}
</style>
</head>
<body>

<div class="wrap">

  <header>
    <div style="display:flex;align-items:center;gap:6px">
    <h1 style="line-height:0">
      <svg width="150" height="112" viewBox="0 0 160 120" style="color:var(--ink);vertical-align:middle">
        <path d="M30 32c8-2 17 2 25 0s17 2 25 0s17-2 25 0s17 2 25 0"
              fill="none" stroke="#C7C3B8" stroke-width="0.6"/>
        <g transform="translate(59,48) scale(0.45)" style="color:var(--dim)">
          <circle cx="6" cy="19" r="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
          <path d="M4.2 17c-0.5 0.5-0.7 1.1-0.5 1.7" fill="none" stroke="currentColor" stroke-width="0.9" stroke-linecap="round" opacity="0.55"/>
          <circle cx="24" cy="8" r="8.5" fill="none" stroke="currentColor" stroke-width="1.3"/>
          <path d="M19 4.5c-1 1-1.4 2.1-1.1 3.3" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>
        </g>
        <g style="color:#5D5D5A">
          <text x="45" y="78" style="font-family:var(--ui);font-weight:400;font-size:22px;fill:currentColor">H</text>
          <g transform="translate(66,63.5) scale(0.68)">
            <path d="M4 10c4-6 16-6 20 0-4 6-16 6-20 0z" fill="none" stroke="currentColor" stroke-width="1.1"/>
            <path d="M24 10l6-4v8l-6-4z" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/>
            <circle cx="9" cy="9" r="0.7" fill="currentColor"/>
          </g>
          <text x="93" y="78" style="font-family:var(--ui);font-weight:400;font-size:22px;fill:currentColor">me</text>
          <line x1="87" y1="96" x2="115" y2="96" stroke="#C7C3B8" stroke-width="0.5"/>
        </g>
      </svg>
    </h1>
    <span style="font-family:var(--mono);font-size:11px;color:var(--dim);display:inline-flex;align-items:center;gap:4px;transform:translateY(17px)">-
      <svg width="18" height="14" viewBox="0 0 34 26" fill="none">
        <circle cx="6" cy="19" r="4" stroke="#C7C3B8" stroke-width="1.1"/>
        <path d="M4.2 17c-0.5 0.5-0.7 1.1-0.5 1.7" stroke="#C7C3B8" stroke-width="0.85" stroke-linecap="round" opacity="0.7"/>
        <circle cx="24" cy="8" r="8.5" stroke="#C7C3B8" stroke-width="1.1"/>
        <path d="M19 4.5c-1 1-1.4 2.1-1.1 3.3" stroke="#C7C3B8" stroke-width="0.95" stroke-linecap="round" opacity="0.7"/>
      </svg>
    </span>
    </div>
    <a id="universeLink" href="orbit01_firebase.html"><svg width="12" height="10" viewBox="0 0 24 20" fill="none" style="vertical-align:-1px;margin-right:4px"><path d="M2 10h18M14 3l7 7-7 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>H°me</a>
  </header>

  <div id="authRow">
    <button id="btnSignIn">ログイン</button>
    <span id="authWho" style="display:none"></span>
  </div>

  <div id="inputCard">
    <div class="bar">
      <div class="barLeft">
        <span id="noteCircle" style="display:inline-flex;align-items:center;justify-content:center;border:none;width:22px;height:16px;overflow:visible">
          <svg width="22" height="16" viewBox="0 0 34 26" style="overflow:visible">
            <circle cx="6" cy="19" r="4" stroke="#C7C3B8" stroke-width="1.1" fill="none"/>

function showDialog({ message, withInput = false, defaultValue = '' }){
  return new Promise((resolve) => {
    dialogMessage.textContent = message;
    dialogInput.style.display = withInput ? 'block' : 'none';
    dialogInput.value = defaultValue;
    dialogOverlay.classList.add('open');
    if(withInput) setTimeout(() => dialogInput.focus(), 50);

    function cleanup(result){
      dialogOverlay.classList.remove('open');
      dialogOk.removeEventListener('click', onOk);
      dialogCancel.removeEventListener('click', onCancel);
      dialogInput.removeEventListener('keydown', onKey);
      resolve(result);
    }
    function onOk(){ cleanup(withInput ? dialogInput.value.trim() : true); }
    function onCancel(){ cleanup(withInput ? null : false); }
    function onKey(e){ if(e.key === 'Enter'){ e.preventDefault(); onOk(); } }
    dialogOk.addEventListener('click', onOk);
    dialogCancel.addEventListener('click', onCancel);
    dialogInput.addEventListener('keydown', onKey);
  });
}
function customConfirm(message){ return showDialog({ message }); }

function fmtDate(iso){
  try{

function preview(n){
  if(n.title){
    const sub = n.purpose || n.concept || '';
    return { title: n.title.slice(0,40), sub: sub.slice(0,80) };
  }
  const lines = (n.text || '').split('\n');
  const title = lines[0].slice(0, 40) || '(無題)';
  const rest = (lines.length > 1 ? lines.slice(1).join(' ') : lines[0].slice(40)).trim();
  return { title, sub: rest.slice(0, 80) };
}

  if(!searchQuery) return true;
  const haystack = [n.title, n.text, n.purpose, n.concept, (n.keywords||[]).join(' ')]

  return haystack.includes(searchQuery);
}

function readFields(container, templateKey){
  const out = {title:'', purpose:'', concept:'', keywords:[]};

    if(f.key === 'keywords') out.keywords = el.value.split(',').map(s=>s.trim()).filter(Boolean);

function colorForCategory(categoryId){
  const sorted = sortedCategoriesForColor();
  const idx = sorted.findIndex(c => c.id === categoryId);
  const palette = ['#A8757F','#6E828C','#7C8A6E','#8C7A5C','#8C6F9E','#5C8C8C','#9E8C5C','#6E7C9E'];
  return idx>=0 ? palette[idx % palette.length] : '#C7C3B8';
}

  const countOf = (c) => notes.filter(n=>n.categoryId===c.id).length;
  return [...categories].sort((a,b)=>countOf(b)-countOf(a));

function applyPoolChoice(note, isNew){

    note.categoryManual = true;
    note.categoryId = pendingManualChoice.categoryId;

    note.categoryId = null;
  }
  // 編集時、ピッカーに触れていなければ何もしない（既存の分類状態をそのまま保つ）
}

/* ---------- 分類：既存システム（AI不使用）による自動振り分け ----------
   文字のNグラム（2文字の連なり）の重なり具合だけで類似度を測る、
   昔からある古典的な手法（Dice係数）。意味の理解はしていない。 */
function ngramSet(text, n=2){
  const clean = (text || '').replace(/\s+/g, '');
  const set = new Set();
  for(let i=0; i<=clean.length-n; i++) set.add(clean.slice(i, i+n));
  return set;
}
function diceSimilarity(a, b){
  const ga = ngramSet(a), gb = ngramSet(b);
  if(ga.size===0 || gb.size===0) return 0;
  let inter = 0;
  for(const g of ga) if(gb.has(g)) inter++;
  return (2*inter) / (ga.size + gb.size);
}
function noteFullText(n){
  return [n.title, n.text, n.purpose, n.concept, (n.keywords||[]).join(' ')].filter(Boolean).join(' ');
}
const SIMILARITY_THRESHOLD = 0.15; // 経験的な目安。厳密なチューニングはしていない

function autoClassify(note){
  const noteTxt = noteFullText(note);
  if(!noteTxt.trim()) return null;
  let best = null, bestScore = 0;
  for(const cat of categories){
    const members = notes.filter(n => n.categoryId === cat.id && n.id !== note.id);
    for(const m of members){
      const score = diceSimilarity(noteTxt, noteFullText(m));
      if(score > bestScore){ bestScore = score; best = cat.id; }
    }
  }
  return bestScore >= SIMILARITY_THRESHOLD ? best : null;
}

function addMemo(){
  const text = memoInput.value.trim();
  const f = readFields(structuredFieldsEl, activeTemplate);

  if(!currentUser) return;

  if(editingNoteId){
    // 編集中のメモを更新する（新規作成はしない）
    const note = notes.find(n => n.id === editingNoteId);
    if(note){
      if(!text && !f.title){
        // 空にして離れた場合は削除する（Keepと同じ挙動）
        notes = notes.filter(n => n.id !== editingNoteId);
      } else {
        note.text = text;
        note.type = activeTemplate;
        note.title = f.title; note.purpose = f.purpose; note.concept = f.concept; note.keywords = f.keywords;
        applyPoolChoice(note, false);
      }
      requestSave();
    }
    exitEditMode();
    render();
    return;
  }

  if(!text && !f.title) return; // 何も書かれていなければ何もしない

  const now = Date.now();
  const newNote = {
    id: 'memo_' + now.toString(36) + Math.random().toString(36).slice(2,5),
    tag: null,
    q: 'idea',            // 初期値。カードのタグをタップして後から変更できる
    t: now,
    text: text,
    sub: '',
    type: activeTemplate,
    title: f.title, purpose: f.purpose, concept: f.concept, keywords: f.keywords,
    categoryId: null,
    categoryManual: false,
    hybrid: null, tentative:false, born:null,
    createdAt: new Date(now).toISOString(),
  };
  applyPoolChoice(newNote, true);

  playConvergeEffect(newNote.categoryId, () => {
    notes.push(newNote);
    memoInput.value = '';
    activeTemplate = null;
    structuredFieldsEl.innerHTML = '';
    expanded = false; collapsed = false;
    inputCard.classList.remove('expanded','collapsed');
    document.querySelectorAll('#inputCard .dot').forEach(d=>d.classList.remove('active'));
    resetPoolPicker(null);
    autoGrow();
    render();
    requestSave();
  });
}

function playConvergeEffect(categoryId, onDone){
  // 「メモ欄の左上の〇」が、内容を包み込みながら小さくなり、
  // 実際に着地するプール（未分類、または該当するプールの箱）へ向かって飛んでいく。
  const startRect = noteCircleEl.getBoundingClientRect();

  const dot = document.createElement('div');
  dot.className = 'converge-dot';
  dot.style.left = startRect.left + 'px';
  dot.style.top  = startRect.top + 'px';
  dot.style.width  = startRect.width + 'px';
  dot.style.height = startRect.height + 'px';
  dot.style.opacity = '0.9';
  dot.style.background = categoryId ? colorForCategory(categoryId) : '#C7C3B8';
  document.body.appendChild(dot);

  const targetBox = categoryId
    ? categoriesEl.querySelector(`[data-cat="${categoryId}"]`)
    : poolEl;
  const targetRect = (targetBox || listEl).getBoundingClientRect();
  const targetX = targetRect.left + Math.min(24, targetRect.width/2);
  const targetY = targetRect.top + 22;

  requestAnimationFrame(() => {
    dot.style.left = (targetX - 4.5) + 'px';
    dot.style.top  = (targetY - 4.5) + 'px';
    dot.style.width  = '9px';
    dot.style.height = '9px';
  });

  setTimeout(() => {
    dot.remove();
    onDone();
  }, 560);
}

memoInput.addEventListener('keydown', (e) => {
  // ⏎は常に改行。Ctrl/Cmd+⏎だけ、その場で確定させたい人向けのショートカット。
  if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){
    e.preventDefault();
    addMemo();
  }
});

const inputCard = $('inputCard');
let mouseDownInsideCard = false;
document.addEventListener('mousedown', (e) => {
  mouseDownInsideCard = inputCard.contains(e.target);
});
document.addEventListener('touchstart', (e) => {
  mouseDownInsideCard = inputCard.contains(e.target);
}, { passive:true });

inputCard.addEventListener('focusout', () => {
  // カード全体からフォーカスが完全に外れた時だけ保存する
  // （タイトル欄→目的欄、プール選択ボタンなど、カード内を操作している間は保存しない）
  setTimeout(() => {
    if(mouseDownInsideCard) return; // カード内の何か（ボタン等）を操作した直後の、見かけ上のフォーカス離脱
    if(!inputCard.contains(document.activeElement)){
      addMemo();
    }
  }, 0);
});

function autoGrow(){
  memoInput.style.height = 'auto';
  const cap = expanded ? 480 : 180;
  memoInput.style.height = Math.min(memoInput.scrollHeight, cap) + 'px';
}
memoInput.addEventListener('input', autoGrow);

/* ---------- ウィンドウの信号機ドット：それぞれ別のテンプレート ---------- */
let collapsed = false, expanded = false;

function toggleTemplate(key){
  const dotEl = {idea:$('dotIdea'), loose:$('dotLoose'), list:$('dotList'), poem:$('dotPoem')}[key];
  if(activeTemplate === key){
    closeTemplate();
    return;
  }
  const prevValues = readFields(structuredFieldsEl, activeTemplate);
  activeTemplate = key;
  expanded = true; collapsed = false;
  inputCard.classList.add('expanded');
  inputCard.classList.remove('collapsed');
  document.querySelectorAll('#inputCard .dot').forEach(d=>d.classList.remove('active'));
  dotEl.classList.add('active');
  renderFields(structuredFieldsEl, activeTemplate, prevValues);
  autoGrow();
}

function closeTemplate(){
  // 同じドットをもう一度押す、または「閉じる」を押した時に呼ばれる（内容は消さずそのまま保持）
  activeTemplate = null;
  expanded = false;
  inputCard.classList.remove('expanded');
  document.querySelectorAll('#inputCard .dot').forEach(d=>d.classList.remove('active'));
  structuredFieldsEl.innerHTML = '';
}

$('clearTemplate').addEventListener('click', closeTemplate);
$('saveTemplate').addEventListener('click', addMemo);

$('dotIdea').addEventListener('click', () => toggleTemplate('idea'));
$('dotLoose').addEventListener('click', () => toggleTemplate('loose'));
$('dotList').addEventListener('click', () => toggleTemplate('list'));
$('dotPoem').addEventListener('click', () => toggleTemplate('poem'));

/* ---------- 編集ページ ---------- */
let editingNoteId = null;
const cardDeleteEl = $('cardDelete');

function openCardForEdit(id){
  const note = notes.find(n => n.id === id);
  if(!note) return;
  editingNoteId = id;

  memoInput.value = note.text || '';
  activeTemplate = note.type || null;
  document.querySelectorAll('#inputCard .dot').forEach(d=>d.classList.remove('active'));
  if(activeTemplate){
    expanded = true; inputCard.classList.add('expanded');
    const dotEl = {idea:$('dotIdea'), loose:$('dotLoose'), list:$('dotList'), poem:$('dotPoem')}[activeTemplate];
    if(dotEl) dotEl.classList.add('active');
    renderFields(structuredFieldsEl, activeTemplate, note);
  } else {
    expanded = false; inputCard.classList.remove('expanded');
    structuredFieldsEl.innerHTML = '';
  }
  inputCard.classList.add('editing');
  resetPoolPicker(note);
  autoGrow();
  window.scrollTo({top:0, behavior:'smooth'});
  setTimeout(() => memoInput.focus(), 200);
  render();
}

function exitEditMode(){
  editingNoteId = null;
  inputCard.classList.remove('editing','expanded');
  activeTemplate = null;
  memoInput.value = '';
  structuredFieldsEl.innerHTML = '';
  document.querySelectorAll('#inputCard .dot').forEach(d=>d.classList.remove('active'));
  resetPoolPicker(null);
  autoGrow();
}

cardDeleteEl.addEventListener('click', async () => {
  if(!editingNoteId) return;
  if(!await customConfirm('このメモを削除しますか？')) return;
  notes = notes.filter(n => n.id !== editingNoteId);
  requestSave();
  exitEditMode();
  render();
});

const poolEl = $('pool'), categoriesEl = $('categories');
poolEl.style.cursor = 'pointer';
poolEl.addEventListener('click', (e) => {
  if(e.target.closest('.zdot')) return; // 〇のクリックはそのメモのカードを開く（別ハンドラ）
  openPoolDetail(null);
});

function makeZDot(note){
  const dot = document.createElement('div');
  dot.className = 'zdot';
  dot.style.background = note.categoryId ? colorForCategory(note.categoryId) : '#C7C3B8';
  dot.title = (note.title || note.text || '').slice(0, 30);
  dot.draggable = true;
  dot.dataset.id = note.id;
  dot.addEventListener('dragstart', (e) => {
    e.dataTransfer.setData('text/plain', note.id);
    setTimeout(() => dot.classList.add('dragging'), 0);
  });
  dot.addEventListener('dragend', () => dot.classList.remove('dragging'));
  dot.addEventListener('click', () => openCardForEdit(note.id));
  return dot;
}

function wireDropzone(el, categoryId){
  el.addEventListener('dragover', (e) => { e.preventDefault(); el.classList.add('dragover'); });
  el.addEventListener('dragleave', () => el.classList.remove('dragover'));
  el.addEventListener('drop', (e) => {
    e.preventDefault();
    el.classList.remove('dragover');
    const id = e.dataTransfer.getData('text/plain');
    const note = notes.find(n => n.id === id);
    if(note){
      note.categoryId = categoryId;
      requestSave();
      renderClassify();
    }
  });
}

function renderClassify(){
  const poolDots = poolEl.querySelector('.dots');
  poolDots.innerHTML = '';
  notes.filter(n => !n.categoryId).forEach(n => poolDots.appendChild(makeZDot(n)));
  wireDropzone(poolEl, null);

  categoriesEl.innerHTML = '';
  const countOf = (cat) => notes.filter(n => n.categoryId === cat.id).length;
  const sortedCats = [...categories].sort((a,b) => countOf(b) - countOf(a));
  sortedCats.forEach(cat => {
    const box = document.createElement('div');
    box.className = 'dropzone';
    box.dataset.cat = cat.id;
    box.style.cursor = 'pointer';
    box.innerHTML = `
      <div class="czlabel">
        <span class="catname">${escapeHtml(cat.name)}</span>
      </div>
      <div class="dots"></div>
    `;
    box.addEventListener('click', (e) => {
      if(e.target.closest('.zdot')) return; // 〇のクリックはそのメモのカードを開く（別ハンドラ）
      openPoolDetail(cat.id);
    });
    const dotsWrap = box.querySelector('.dots');
    notes.filter(n => n.categoryId === cat.id).forEach(n => dotsWrap.appendChild(makeZDot(n)));
    wireDropzone(box, cat.id);
    categoriesEl.appendChild(box);
  });
}

/* ---------- プール詳細（タイトルを押すと開く：一覧・改名・移動） ---------- */
const poolOverlayEl = $('poolOverlay'), poolNameInputEl = $('poolNameInput'), poolNoteListEl = $('poolNoteList');
let openPoolId = null;

function openPoolDetail(catId){
  if(catId === null){
    openPoolId = null;
    poolNameInputEl.value = '未分類';
    poolNameInputEl.disabled = true;
    $('poolDeleteBtn').style.display = 'none';
    $('poolAutoBtn').style.display = 'inline';
    renderPoolNoteList(null);
    poolOverlayEl.classList.add('open');
    return;
  }
  const cat = categories.find(c => c.id === catId);
  if(!cat) return;
  openPoolId = catId;
  poolNameInputEl.disabled = false;
  $('poolDeleteBtn').style.display = 'inline';
  $('poolAutoBtn').style.display = 'none';
  poolNameInputEl.value = cat.name;
  renderPoolNoteList(catId);
  poolOverlayEl.classList.add('open');
}

function renderPoolNoteList(catId){
  const items = notes.filter(n => n.categoryId === catId).sort((a,b) => (b.t||0)-(a.t||0));
  if(items.length === 0){
    poolNoteListEl.innerHTML = '<div id="poolEmpty">まだメモがありません</div>';
    return;
  }
  poolNoteListEl.innerHTML = items.map(n => {
    const { title } = preview(n);
    const options = ['<option value="">— 移動先を選ぶ —</option>']
      .concat(catId !== null ? ['<option value="__NONE__">未分類へ</option>'] : [])
      .concat(categories.filter(c => c.id !== catId).map(c => `<option value="${c.id}">${escapeHtml(c.name)}へ</option>`))
      .join('');
    return `
      <div class="poolItem" data-id="${n.id}">
        <div class="piTop">
          <span class="piTitle">${escapeHtml(title)}</span>
          <span class="piDate">${fmtDate(n.createdAt || (n.t ? new Date(n.t).toISOString() : ''))}</span>
        </div>
        <select data-id="${n.id}">${options}</select>
      </div>
    `;
  }).join('');

  poolNoteListEl.querySelectorAll('.poolItem .piTitle').forEach(el => {
    el.style.cursor = 'pointer';
    el.addEventListener('click', () => {
      const id = el.closest('.poolItem').dataset.id;
      poolOverlayEl.classList.remove('open');
      openCardForEdit(id);
    });
  });
  poolNoteListEl.querySelectorAll('select').forEach(sel => {
    sel.addEventListener('change', () => {
      const id = sel.dataset.id;
      const note = notes.find(n => n.id === id);
      if(!note || !sel.value) return;
      note.categoryId = sel.value === '__NONE__' ? null : sel.value;
      note.categoryManual = true; // 手動で移動したので、以後の自動判定からは外す
      requestSave();
      renderPoolNoteList(catId);
      renderClassify();
    });
  });
}

poolNameInputEl.addEventListener('change', () => {
  const cat = categories.find(c => c.id === openPoolId);
  const name = poolNameInputEl.value.trim();
  if(!cat || !name) return;
  cat.name = name;
  requestSave();
  renderClassify();
});
function runAutoClassifyOnUnclassified(){
  const targets = notes.filter(n => !n.categoryId && !n.categoryManual);
  targets.forEach(n => {
    const result = autoClassify(n);
    if(result) n.categoryId = result;
  });
  requestSave();
  if(poolOverlayEl.classList.contains('open') && openPoolId === null) renderPoolNoteList(null);
  renderClassify();
}
$('poolAutoBtn').addEventListener('click', runAutoClassifyOnUnclassified);
$('poolAutoBtnInline').addEventListener('click', (e) => {
  e.stopPropagation(); // 箱全体のクリック（詳細を開く）と競合しないように
  runAutoClassifyOnUnclassified();
});

$('poolCloseBtn').addEventListener('click', () => {
  poolOverlayEl.classList.remove('open');
  openPoolId = null;
});
$('poolDeleteBtn').addEventListener('click', async () => {
  const cat = categories.find(c => c.id === openPoolId);
  if(!cat) return;
  if(!await customConfirm(`「${cat.name}」を削除しますか？（中のメモは未分類プールに戻ります）`)) return;
  notes.forEach(n => { if(n.categoryId === cat.id) n.categoryId = null; });
  categories = categories.filter(c => c.id !== cat.id);
  requestSave();
  poolOverlayEl.classList.remove('open');
  openPoolId = null;
  renderClassify();
});

$('btnAddCategory').addEventListener('click', async () => {
  const name = await customPrompt('新しい水槽の名前は？');
  if(!name || !name.trim()) return;
  categories.push({ id: 'cat_' + Date.now().toString(36), name: name.trim() });
  requestSave();
  renderClassify();
});

const listToggleEl = $('listToggle'), listSectionEl = $('listSection');
listToggleEl.addEventListener('click', () => {
  const open = listSectionEl.classList.toggle('open');
  listToggleEl.textContent = (open ? '▾ 一覧' : '▸ 一覧');
});

$('searchInput').addEventListener('input', (e) => {
  searchQuery = e.target.value.trim().toLowerCase();
  if(searchQuery){
    listSectionEl.classList.add('open');
    listToggleEl.textContent = '▾ 一覧';
  }
  render();
});

render();

/* ---------- H゜meへ移動する前、泡を一瞬点滅させる ---------- */
document.getElementById('universeLink').addEventListener('click', function(e){
  e.preventDefault();
  const href = this.getAttribute('href');
  const bubble = document.getElementById('noteCircle');
  if(bubble) bubble.classList.add('blink');
  setTimeout(() => { window.location.href = href; }, 220);
});

/* ---------- 入場演出：下から上へ、シャボンが飛んでいく（読み込み時に一度だけ） ---------- */
(function bubbleIntro(){
  const wrap = document.getElementById('bubbleIntro');
  if(!wrap) return;
  const N = 7;
  for(let i=0;i<N;i++){
    const size = 14 + Math.random()*34;              // 14〜48px
    const left = 5 + Math.random()*90;                 // 画面幅の5〜95%
    const duration = 3.2 + Math.random()*2.2;           // 3.2〜5.4秒
    const delay = Math.random()*1.6;                    // 0〜1.6秒ずらして出す
    const drift = (Math.random()-0.5)*60;               // 少し左右に揺れながら昇る

    const bubble = document.createElement('div');
    bubble.style.cssText = `
      position:absolute; left:${left}%; bottom:-60px;
      width:${size}px; height:${size}px;
      animation:bubbleRise ${duration}s ease-in ${delay}s forwards;
      --drift:${drift}px;
    `;
    bubble.innerHTML = `
      <svg width="${size}" height="${size}" viewBox="0 0 40 40" style="overflow:visible">
        <defs>
          <radialGradient id="biIri${i}" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
            <stop offset="30%" stop-color="#ffe1f0" stop-opacity="0.32"/>
            <stop offset="55%" stop-color="#d9f2e6" stop-opacity="0.36"/>
            <stop offset="75%" stop-color="#d6e8ff" stop-opacity="0.42"/>
            <stop offset="100%" stop-color="#fff3c9" stop-opacity="0.5"/>
          </radialGradient>
          <radialGradient id="biEdge${i}" cx="50%" cy="50%" r="50%">
            <stop offset="65%" stop-color="#ffffff" stop-opacity="0"/>
            <stop offset="85%" stop-color="#ff9ecf" stop-opacity="0.6"/>
            <stop offset="92%" stop-color="#8fd8ff" stop-opacity="0.65"/>
            <stop offset="100%" stop-color="#c8ffcf" stop-opacity="0.7"/>
          </radialGradient>
        </defs>
        <circle cx="20" cy="20" r="17" fill="url(#biIri${i})" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.85"/>
        <circle cx="20" cy="20" r="17" fill="url(#biEdge${i})" style="mix-blend-mode:screen"/>
        <ellipse cx="14" cy="12" rx="4" ry="2.2" fill="#ffffff" opacity="0.9" transform="rotate(-25 14 12)"/>
      </svg>
    `;
    wrap.appendChild(bubble);
    bubble.addEventListener('animationend', () => bubble.remove());
  }
})();
</script>

<style>
@keyframes bubbleRise{
  0%   { transform: translate(0, 0);              opacity: 0; }
  8%   { opacity: 1; }
  100% { transform: translate(var(--drift), calc(-100vh - 80px)); opacity: 0; }
}
</style>
