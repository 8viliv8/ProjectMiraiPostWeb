<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="memo">
<title>memo — v0.2</title>
<style>
:root{
  --paper:#fff;
  --ink:#171717;
  --sub:#9a9a9a;
  --line:#ededed;
  --sheet:#f7f7f7;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Yu Gothic UI","Yu Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit}
button{border:0;background:none;color:inherit;padding:0}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid #bbb;outline-offset:2px}
[hidden]{display:none!important}

#app{min-height:100dvh;background:var(--paper)}
.view{min-height:100dvh}

/* editor */
#editorView{display:flex;flex-direction:column}
.editorTop{
  height:62px;padding:env(safe-area-inset-top) 22px 0;
  display:flex;align-items:flex-end;justify-content:space-between;flex:none;
}
.editorTop button{font-size:23px;line-height:1;color:#a6a6a6;width:36px;height:36px;display:grid;place-items:center}
.editorTop .more{font-size:22px;letter-spacing:2px;padding-bottom:5px}
.editorWrap{width:min(760px,100%);margin:0 auto;padding:42px 28px calc(120px + env(safe-area-inset-bottom));flex:1}
.date{font-size:12px;letter-spacing:.03em;color:#aaa;margin-bottom:22px;user-select:none}
#editor{
  width:100%;min-height:62vh;border:0;resize:none;background:transparent;color:var(--ink);
  font-size:19px;line-height:1.9;font-weight:400;letter-spacing:.01em;padding:0;margin:0;
  caret-color:#222;overflow:hidden;
}
#editor::placeholder{color:#d5d5d5}
.saveState{position:fixed;right:18px;bottom:calc(14px + env(safe-area-inset-bottom));font-size:10px;color:#c1c1c1;opacity:0;transition:opacity .25s;pointer-events:none}
.saveState.show{opacity:1}

/* list */
#listView{background:#fff;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
.listTop{position:sticky;top:0;z-index:4;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);padding:calc(18px + env(safe-area-inset-top)) 24px 12px;border-bottom:1px solid transparent}
.listHeader{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.listHeader h1{font-size:30px;line-height:1;font-weight:650;letter-spacing:-.04em;margin:0}
.listHeader button{font-size:13px;color:#969696;padding:8px 0}
.searchWrap{position:relative}
#search{width:100%;border:0;border-radius:12px;background:#f5f5f5;padding:11px 14px;font-size:15px;color:#222}
#search::placeholder{color:#b6b6b6}
#notes{padding:4px 24px 0}
.noteRow{padding:20px 0 18px;border-bottom:1px solid var(--line);cursor:pointer}
.noteDate{font-size:11px;color:#aaa;margin-bottom:7px}
.noteTitle{font-size:17px;line-height:1.5;font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.notePreview{font-size:14px;line-height:1.55;color:#8f8f8f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:90px 0;text-align:center;color:#bbb;font-size:14px}
.newBtn{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;background:#171717;color:#fff;font-size:27px;line-height:1;box-shadow:0 8px 22px rgba(0,0,0,.13);z-index:6}

/* menu */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.12);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
.sheet{width:min(520px,100%);background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.12)}
.sheet button{display:block;width:100%;text-align:left;padding:16px 18px;border-bottom:1px solid #f0f0f0;font-size:16px}
.sheet button:last-child{border-bottom:0}
.sheet .muted{color:#777}
.sheet .danger{color:#b44}
.sheet .cancel{text-align:center;font-size:15px;color:#777}

/* auth */
#authPill{position:fixed;left:18px;bottom:calc(16px + env(safe-area-inset-bottom));font-size:10px;color:#c0c0c0;z-index:7}

@media (min-width:800px){
  #app{max-width:980px;margin:0 auto;border-left:1px solid #f4f4f4;border-right:1px solid #f4f4f4}
  .editorWrap{padding-top:70px}
  #editor{font-size:20px;line-height:1.95}
}
</style>
</head>
<body>
<div id="app">
  <section id="editorView" class="view">
    <div class="editorTop">
      <button id="backBtn" aria-label="一覧">‹</button>
      <button id="moreBtn" class="more" aria-label="その他">•••</button>
    </div>
    <main class="editorWrap">
      <div id="dateLabel" class="date"></div>
      <textarea id="editor" spellcheck="false" autocapitalize="sentences" placeholder=""></textarea>
    </main>
    <div id="saveState" class="saveState">saved</div>
  </section>

  <section id="listView" class="view" hidden>
    <div class="listTop">
      <div class="listHeader">
        <h1>notes</h1>
        <button id="authBtn">同期</button>
      </div>
      <div class="searchWrap"><input id="search" type="search" placeholder="検索" autocomplete="off"></div>
    </div>
    <div id="notes"></div>
    <button id="newBtn" class="newBtn" aria-label="新規メモ">＋</button>
  </section>
</div>

<div id="menu" class="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <button id="todoBtn">ToDo にする</button>
    <button id="melolyBtn">Meloly mini へ送る</button>
    <button id="copyMdBtn">Markdown をコピー</button>
    <button id="downloadMdBtn">Markdown を保存</button>
    <button id="deleteBtn" class="danger">削除</button>
    <button id="cancelBtn" class="cancel">閉じる</button>
  </div>
</div>

<div id="authPill"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, doc, setDoc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: 'AIzaSyDYoZqDdhyS2q3GPmvdrfotJYxnsLydiQg',
  authDomain: 'orbit-65a9b.firebaseapp.com',
  projectId: 'orbit-65a9b',
  storageBucket: 'orbit-65a9b.firebasestorage.app',
  messagingSenderId: '967386787141',
  appId: '1:967386787141:web:9a904e982e7daa44da622c'
};
const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);
const db = getFirestore(fb);
const provider = new GoogleAuthProvider();
let currentUser = null;
let cloudTimer = null;

const $ = s => document.querySelector(s);
const editorView = $('#editorView'), listView = $('#listView'), editor = $('#editor');
const notesEl = $('#notes'), search = $('#search'), menu = $('#menu'), saveState = $('#saveState');
const authBtn = $('#authBtn'), authPill = $('#authPill');

const KEY = 'memoPrototypeV2';
let state = loadLocal();
let activeId = null;
let saveTimer = null;

function nowISO(){ return new Date().toISOString(); }
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2)); }
function emptyState(){ return {notes:[], todos:[]}; }
function loadLocal(){
  try{ const v = JSON.parse(localStorage.getItem(KEY)); return v && Array.isArray(v.notes) ? v : emptyState(); }
  catch(e){ return emptyState(); }
}
function persist(){
  localStorage.setItem(KEY, JSON.stringify(state));
  showSaved();
  if(currentUser){ clearTimeout(cloudTimer); cloudTimer=setTimeout(saveCloud,650); }
}
async function saveCloud(){
  if(!currentUser) return;
  try{ await setDoc(doc(db,'users',currentUser.uid),{memoPrototypeV2:state},{merge:true}); }
  catch(e){ console.warn('cloud save failed',e); }
}
async function loadCloud(){
  if(!currentUser) return;
  try{
    const snap=await getDoc(doc(db,'users',currentUser.uid));
    const cloud=snap.exists()?snap.data().memoPrototypeV2:null;
    if(cloud && Array.isArray(cloud.notes)){
      const map=new Map();
      [...state.notes,...cloud.notes].forEach(n=>{ const old=map.get(n.id); if(!old || (n.updatedAt||'')>(old.updatedAt||'')) map.set(n.id,n); });
      state.notes=[...map.values()];
      state.todos=[...(cloud.todos||[]),...(state.todos||[])].filter((v,i,a)=>a.findIndex(x=>x.id===v.id)===i);
      localStorage.setItem(KEY,JSON.stringify(state));
    }else await saveCloud();
  }catch(e){ console.warn('cloud load failed',e); }
}
function showSaved(){
  saveState.classList.add('show');
  clearTimeout(showSaved.t); showSaved.t=setTimeout(()=>saveState.classList.remove('show'),850);
}

function fmtDate(iso,long=false){
  const d=new Date(iso||Date.now());
  if(long) return new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(d);
  return new Intl.DateTimeFormat('ja-JP',{month:'numeric',day:'numeric'}).format(d);
}
function firstLine(text){ return (text||'').split(/\n/).find(x=>x.trim())?.trim() || '無題'; }
function preview(text){
  const lines=(text||'').split(/\n/).map(x=>x.trim()).filter(Boolean);
  return lines.slice(1).join(' ') || '';
}
function getActive(){ return state.notes.find(n=>n.id===activeId); }
function makeNote(){
  const n={id:uid(),text:'',createdAt:nowISO(),updatedAt:nowISO()};
  state.notes.unshift(n); activeId=n.id; persist(); return n;
}
function resizeEditor(){ editor.style.height='auto'; editor.style.height=Math.max(window.innerHeight*.62,editor.scrollHeight+4)+'px'; }

function openEditor(id=null){
  const n=id?state.notes.find(x=>x.id===id):makeNote();
  if(!n) return;
  activeId=n.id;
  editor.value=n.text||'';
  $('#dateLabel').textContent=fmtDate(n.createdAt,true);
  listView.hidden=true; editorView.hidden=false;
  resizeEditor();
  setTimeout(()=>editor.focus({preventScroll:true}),80);
}
function openList(){
  flushEditor();
  const n=getActive();
  if(n && !n.text.trim()) state.notes=state.notes.filter(x=>x.id!==n.id);
  activeId=null; persist();
  editorView.hidden=true; listView.hidden=false;
  renderList();
}
function flushEditor(){
  const n=getActive(); if(!n) return;
  if(n.text!==editor.value){ n.text=editor.value; n.updatedAt=nowISO(); persist(); }
}
function scheduleSave(){
  clearTimeout(saveTimer); saveTimer=setTimeout(flushEditor,280);
}
function renderList(){
  const q=search.value.trim().toLowerCase();
  const arr=[...state.notes].filter(n=>n.text.trim()).filter(n=>!q || n.text.toLowerCase().includes(q)).sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));
  if(!arr.length){ notesEl.innerHTML='<div class="empty">まだ何もありません</div>'; return; }
  notesEl.innerHTML=arr.map(n=>`<article class="noteRow" data-id="${n.id}"><div class="noteDate">${fmtDate(n.updatedAt)}</div><div class="noteTitle">${escapeHtml(firstLine(n.text))}</div>${preview(n.text)?`<div class="notePreview">${escapeHtml(preview(n.text))}</div>`:''}</article>`).join('');
  notesEl.querySelectorAll('.noteRow').forEach(el=>el.addEventListener('click',()=>openEditor(el.dataset.id)));
}
function escapeHtml(s){ return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
function mdOf(n){
  if(!n) return '';
  const title=firstLine(n.text);
  return `# ${title}\n\n${n.text.trim()}\n\n---\ncreated: ${n.createdAt}\nupdated: ${n.updatedAt}\n`;
}

editor.addEventListener('input',()=>{ resizeEditor(); scheduleSave(); });
editor.addEventListener('blur',flushEditor);
$('#backBtn').addEventListener('click',openList);
$('#newBtn').addEventListener('click',()=>openEditor());
search.addEventListener('input',renderList);
$('#moreBtn').addEventListener('click',()=>{ flushEditor(); menu.hidden=false; });
$('#cancelBtn').addEventListener('click',()=>menu.hidden=true);
menu.addEventListener('click',e=>{ if(e.target===menu) menu.hidden=true; });

$('#copyMdBtn').addEventListener('click',async()=>{ const n=getActive(); if(n) await navigator.clipboard.writeText(mdOf(n)); menu.hidden=true; });
$('#downloadMdBtn').addEventListener('click',()=>{
  const n=getActive(); if(!n) return;
  const blob=new Blob([mdOf(n)],{type:'text/markdown;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=(firstLine(n.text).replace(/[\\/:*?"<>|]/g,'_').slice(0,40)||'memo')+'.md'; a.click(); URL.revokeObjectURL(a.href); menu.hidden=true;
});
$('#todoBtn').addEventListener('click',()=>{
  const n=getActive(); if(!n || !n.text.trim()) return;
  state.todos=state.todos||[]; if(!state.todos.some(t=>t.sourceNoteId===n.id)) state.todos.unshift({id:uid(),sourceNoteId:n.id,text:firstLine(n.text),done:false,createdAt:nowISO()});
  persist(); menu.hidden=true;
});
$('#melolyBtn').addEventListener('click',async()=>{
  const n=getActive(); if(!n || !n.text.trim()) return;
  try{ await navigator.clipboard.writeText(n.text); }catch(e){}
  window.open('https://incandescent-vacherin-930df0.netlify.app/quickmemo.html','_blank','noopener'); menu.hidden=true;
});
$('#deleteBtn').addEventListener('click',()=>{
  if(!activeId) return; state.notes=state.notes.filter(n=>n.id!==activeId); persist(); menu.hidden=true; openList();
});

authBtn.addEventListener('click',async()=>{
  if(currentUser) await signOut(auth); else await signInWithPopup(auth,provider).catch(()=>{});
});
onAuthStateChanged(auth,async user=>{
  currentUser=user; authBtn.textContent=user?'同期中':'同期'; authPill.textContent=user?'cloud':'';
  if(user){ await loadCloud(); if(!listView.hidden) renderList(); }
});

window.addEventListener('beforeunload',flushEditor);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) flushEditor(); });

// 起動時は「管理画面」ではなく、まず書く場所を開く。
// 既存の空メモがあればそこへ、なければ新規作成。
const recent=[...state.notes].sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''))[0];
if(recent && !recent.text.trim()) openEditor(recent.id); else openEditor();
</script>
</body>
</html>
