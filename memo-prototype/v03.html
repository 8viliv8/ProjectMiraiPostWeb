<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>memo</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;background:#000;color:#f2f2f7;-webkit-font-smoothing:antialiased}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Yu Gothic",sans-serif;overflow:hidden}button{font:inherit;border:0;background:none;color:inherit;padding:0}.view{position:fixed;inset:0;background:#000;transition:none}#listView{padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 100px);overflow:auto;visibility:visible;opacity:1;pointer-events:auto}#editorView{padding:calc(env(safe-area-inset-top) + 22px) 18px calc(env(safe-area-inset-bottom) + 100px);overflow:auto;visibility:hidden;opacity:0;pointer-events:none}body.editing #listView{visibility:hidden;opacity:0;pointer-events:none}body.editing #editorView{visibility:visible;opacity:1;pointer-events:auto}.listHeader{margin-bottom:25px}.listHeader h1{margin:0;font-size:30px;line-height:1;font-weight:650;letter-spacing:-.035em}#notes{border-top:1px solid #262628}.noteRow{padding:18px 0;border-bottom:1px solid #262628;cursor:pointer}.noteTitle{font-size:17px;line-height:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}.notePreview{font-size:14px;line-height:20px;color:#98989d;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}.noteKind{display:inline-block;margin-top:8px;font-size:11px;line-height:18px;padding:0 7px;border-radius:9px;color:#8e8e93;background:#1c1c1e}.empty{padding:80px 0;text-align:center;font-size:14px;color:#6f6f74}#note{display:block;width:100%;min-height:75vh;margin:0;padding:0;border:0;outline:0;background:transparent;color:#f2f2f7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Yu Gothic",sans-serif;font-size:17px;line-height:22px;font-weight:400;letter-spacing:0;caret-color:#f2f2f7;white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text;-webkit-text-size-adjust:100%}.action{position:fixed;z-index:10;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 17px);min-width:54px;height:48px;padding:0 18px;border-radius:24px;background:rgba(35,35,37,.96);font-size:22px;line-height:48px;text-align:center;color:#e5e5ea;box-shadow:0 1px 7px rgba(0,0,0,.28);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);touch-action:manipulation}.action.back{font-size:25px;font-weight:300}#classify{position:fixed;z-index:30;inset:0;background:rgba(0,0,0,0);visibility:hidden;pointer-events:none;transition:background .18s ease}#classify.show{visibility:visible;pointer-events:auto;background:rgba(0,0,0,.42)}.classifyPanel{position:absolute;top:0;right:0;width:min(84vw,360px);height:100%;padding:calc(env(safe-area-inset-top) + 34px) 22px calc(env(safe-area-inset-bottom) + 24px);background:#111113;box-shadow:-18px 0 40px rgba(0,0,0,.32);transform:translateX(100%);transition:transform .22s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}#classify.show .classifyPanel{transform:translateX(0)}.classifyHint{font-size:12px;color:#74747a;margin:0 0 18px}.kindBtn{display:block;width:100%;height:62px;border-top:1px solid #29292c;text-align:left;padding:0 2px;font-size:20px;font-weight:500;color:#f2f2f7}.kindBtn:first-of-type{border-top:0}.kindBtn.unclassified{color:#8e8e93}@media(min-width:700px){#editorView,#listView{padding-left:max(28px,calc((100vw - 644px)/2));padding-right:max(28px,calc((100vw - 644px)/2))}}
</style></head><body>
<section id="listView" class="view"><div class="listHeader"><h1>メモ</h1></div><div id="notes"></div><button class="action" id="newBtn" aria-label="新規メモ">＋</button></section>
<section id="editorView" class="view"><div id="note" contenteditable="true" role="textbox" aria-multiline="true" inputmode="text" enterkeyhint="enter" autocapitalize="sentences" spellcheck="false" aria-label="メモ"></div><button class="action back" id="backBtn" aria-label="一覧へ戻る">‹</button></section>
<div id="classify" aria-hidden="true"><div class="classifyPanel"><div class="classifyHint">これは何のメモ？</div><button class="kindBtn" data-kind="歌詞">歌詞</button><button class="kindBtn" data-kind="アイデア">アイデア</button><button class="kindBtn" data-kind="仕事">仕事</button><button class="kindBtn unclassified" data-kind="">未分類</button></div></div>
<script>
const KEY='memo-v05-notes';const notesEl=document.getElementById('notes'),note=document.getElementById('note'),newBtn=document.getElementById('newBtn'),backBtn=document.getElementById('backBtn'),classify=document.getElementById('classify');let notes=load(),activeId=null,startX=0,startY=0,lastX=0,lastY=0,tracking=false;
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));return Array.isArray(v)?v:[]}catch(e){return []}}function save(){localStorage.setItem(KEY,JSON.stringify(notes))}function uid(){return(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}function now(){return new Date().toISOString()}function cleanText(){return note.innerText.replace(/\u00a0/g,' ').replace(/\n+$/,'')}function firstLine(text){const line=(text||'').split(/\n/).find(v=>v.trim());return line?line.trim():'新しいメモ'}function restText(text){const lines=(text||'').split(/\n/);const i=lines.findIndex(v=>v.trim());if(i<0)return'';return lines.slice(i+1).join('\n').trim()}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderList(){const visible=[...notes].filter(n=>n.text.trim()).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));if(!visible.length){notesEl.innerHTML='<div class="empty">まだ何もありません</div>';return}notesEl.innerHTML=visible.map(n=>{const preview=restText(n.text),kind=n.kind||'';return`<article class="noteRow" data-id="${n.id}"><div class="noteTitle">${esc(firstLine(n.text))}</div>${preview?`<div class="notePreview">${esc(preview)}</div>`:''}${kind?`<span class="noteKind">${esc(kind)}</span>`:''}</article>`}).join('');notesEl.querySelectorAll('.noteRow').forEach(el=>el.addEventListener('click',()=>openEditor(el.dataset.id,false)))}
function placeCaretEnd(){const r=document.createRange();r.selectNodeContents(note);r.collapse(false);const s=window.getSelection();s.removeAllRanges();s.addRange(r)}function makeNote(){const t=now(),n={id:uid(),text:'',kind:'',createdAt:t,updatedAt:t};notes.unshift(n);save();return n}function openEditor(id,isNew){let n=notes.find(x=>x.id===id);if(!n)n=makeNote();activeId=n.id;note.textContent=n.text;document.body.classList.add('editing');void note.offsetHeight;if(isNew){note.focus({preventScroll:true});placeCaretEnd()}}function startNew(e){if(e){e.preventDefault();e.stopPropagation()}openEditor(null,true)}function flush(){if(!activeId)return;const n=notes.find(x=>x.id===activeId);if(!n)return;const text=cleanText();if(n.text!==text){n.text=text;n.updatedAt=now();save()}}function showClassify(){if(!activeId||classify.classList.contains('show'))return;flush();note.blur();classify.classList.add('show');classify.setAttribute('aria-hidden','false')}function hideClassify(){classify.classList.remove('show');classify.setAttribute('aria-hidden','true')}function finishToList(kind){flush();const n=notes.find(x=>x.id===activeId);if(n){n.kind=kind;n.updatedAt=now()}if(n&&!n.text.trim())notes=notes.filter(x=>x.id!==activeId);save();hideClassify();activeId=null;document.body.classList.remove('editing');note.blur();renderList()}function backToList(e){if(e)e.preventDefault();finishToList(notes.find(x=>x.id===activeId)?.kind||'')}
note.addEventListener('input',()=>{if(!activeId)return;const n=notes.find(x=>x.id===activeId);if(!n)return;n.text=cleanText();n.updatedAt=now();save()});newBtn.addEventListener('touchend',startNew,{passive:false});newBtn.addEventListener('click',e=>{if(!('ontouchstart'in window))startNew(e)});backBtn.addEventListener('touchend',backToList,{passive:false});backBtn.addEventListener('click',e=>{if(!('ontouchstart'in window))backToList(e)});
document.addEventListener('touchstart',e=>{if(!document.body.classList.contains('editing')||classify.classList.contains('show')||e.touches.length!==1)return;const t=e.touches[0];startX=lastX=t.clientX;startY=lastY=t.clientY;tracking=startX>window.innerWidth*.42},{capture:true,passive:true});document.addEventListener('touchmove',e=>{if(!tracking||e.touches.length!==1)return;const t=e.touches[0];lastX=t.clientX;lastY=t.clientY;const dx=lastX-startX,dy=lastY-startY;if(dx<-34&&Math.abs(dx)>Math.abs(dy)*1.15)e.preventDefault()},{capture:true,passive:false});document.addEventListener('touchend',e=>{if(!tracking)return;tracking=false;if(e.changedTouches.length){lastX=e.changedTouches[0].clientX;lastY=e.changedTouches[0].clientY}const dx=lastX-startX,dy=lastY-startY;if(dx<-48&&Math.abs(dx)>Math.abs(dy)*1.15)showClassify()},{capture:true,passive:true});document.addEventListener('touchcancel',()=>{tracking=false},{capture:true,passive:true});
document.querySelectorAll('.kindBtn').forEach(b=>b.addEventListener('click',()=>finishToList(b.dataset.kind)));classify.addEventListener('click',e=>{if(e.target===classify){hideClassify();note.focus({preventScroll:true})}});document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});window.addEventListener('pagehide',flush);renderList();
</script></body></html>
