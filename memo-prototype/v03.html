<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#000000"><title>memo</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;background:#000;color:#f2f2f7;-webkit-font-smoothing:antialiased}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Yu Gothic",sans-serif;overflow:hidden}button{font:inherit;border:0;background:none;color:inherit;padding:0}.view{position:fixed;inset:0;background:#000;transition:none;-webkit-overflow-scrolling:touch;scrollbar-width:none}.view::-webkit-scrollbar{display:none}#listView{padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 100px);overflow-y:auto;overflow-x:hidden;visibility:visible;opacity:1;pointer-events:auto}#editorView{padding:calc(env(safe-area-inset-top) + 22px) 18px calc(env(safe-area-inset-bottom) + 100px);overflow-y:auto;overflow-x:hidden;visibility:hidden;opacity:0;pointer-events:none}body.editing #listView{visibility:hidden;opacity:0;pointer-events:none}body.editing #editorView{visibility:visible;opacity:1;pointer-events:auto}.listHeader{margin-bottom:25px}.listHeader h1{margin:0;font-size:30px;line-height:1;font-weight:650;letter-spacing:-.035em}#notes{border-top:1px solid #262628}.noteSwipe{position:relative;overflow:hidden;border-bottom:1px solid #262628}.noteRow{position:relative;z-index:2;padding:18px 0;background:#000;cursor:pointer;transform:translateX(0);transition:transform .18s ease;touch-action:pan-y}.noteSwipe.open .noteRow{transform:translateX(-82px)}.deleteBtn{position:absolute;z-index:1;right:0;top:0;bottom:0;width:82px;background:#ff453a;color:#fff;font-size:15px;font-weight:600;text-align:center}.noteTitle{font-size:17px;line-height:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}.notePreview{font-size:14px;line-height:20px;color:#98989d;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}.empty{padding:80px 0;text-align:center;font-size:14px;color:#6f6f74}#note{display:block;width:100%;min-height:0;margin:0;padding:0;border:0;outline:0;background:transparent;color:#f2f2f7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Yu Gothic",sans-serif;font-size:17px;line-height:22px;font-weight:400;letter-spacing:0;caret-color:#f2f2f7;white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text;-webkit-text-size-adjust:100%}#note:empty:after{content:'\00a0';visibility:hidden}.action{position:fixed;z-index:10;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 17px);min-width:54px;height:48px;padding:0 18px;border-radius:24px;background:rgba(35,35,37,.96);font-size:22px;line-height:48px;text-align:center;color:#e5e5ea;box-shadow:0 1px 7px rgba(0,0,0,.28);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);touch-action:manipulation}.action.back{font-size:25px;font-weight:300}.formatBar{position:fixed;z-index:24;left:50%;display:flex;overflow:hidden;border:1px solid #343438;border-radius:19px;background:rgba(28,28,30,.96);box-shadow:0 4px 18px rgba(0,0,0,.28);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transform:translateX(-50%);opacity:0;pointer-events:none;transition:opacity .12s ease}body.editing.keyboard .formatBar{opacity:1;pointer-events:auto}.formatBtn{min-width:55px;height:38px;padding:0 14px;font-size:16px;line-height:38px;color:#e5e5ea;touch-action:manipulation}.formatBtn+.formatBtn{border-left:1px solid #343438}.formatBtn .small{font-size:12px;color:#98989d;margin-left:4px}#router{position:fixed;z-index:30;inset:0;background:rgba(0,0,0,0);display:flex;align-items:flex-end;visibility:hidden;pointer-events:none;transition:background .18s ease}#router.show{visibility:visible;pointer-events:auto;background:rgba(0,0,0,.48)}.routerPanel{width:100%;padding:17px 18px calc(env(safe-area-inset-bottom) + 18px);background:#111113;border-radius:24px 24px 0 0;box-shadow:0 -14px 40px rgba(0,0,0,.28);transform:translateY(100%);transition:transform .22s cubic-bezier(.2,.8,.2,1)}#router.show .routerPanel{transform:translateY(0)}.routerHandle{width:36px;height:5px;border-radius:3px;background:#3a3a3c;margin:0 auto 15px}.routerHint{text-align:center;font-size:12px;color:#74747a;margin:0 0 10px}.routeBtn{display:block;width:100%;height:58px;border-top:1px solid #29292c;text-align:center;font-size:18px;font-weight:500;color:#f2f2f7}.toast{position:fixed;z-index:50;left:50%;bottom:calc(env(safe-area-inset-bottom) + 32px);transform:translate(-50%,12px);padding:9px 14px;border-radius:18px;background:#2c2c2e;color:#f2f2f7;font-size:13px;opacity:0;pointer-events:none;transition:opacity .16s ease,transform .16s ease}.toast.show{opacity:1;transform:translate(-50%,0)}@media(min-width:700px){#editorView,#listView{padding-left:max(28px,calc((100vw - 644px)/2));padding-right:max(28px,calc((100vw - 644px)/2))}.routerPanel{max-width:620px;margin:0 auto}}
</style></head><body>
<section id="listView" class="view"><div class="listHeader"><h1>メモ</h1></div><div id="notes"></div><button class="action" id="newBtn" aria-label="新規メモ">＋</button></section><section id="editorView" class="view"><div id="note" contenteditable="true" role="textbox" aria-multiline="true" inputmode="text" enterkeyhint="enter" autocapitalize="sentences" spellcheck="false" aria-label="メモ"></div><button class="action back" id="backBtn" aria-label="一覧へ戻る">‹</button></section>
<div id="formatBar" class="formatBar" aria-label="入力ツール"><button class="formatBtn" data-insert="todo">○<span class="small">TODO</span></button><button class="formatBtn" data-insert="space">↵↵</button><button class="formatBtn" data-insert="underscore">_</button></div>
<div id="router" aria-hidden="true"><div class="routerPanel"><div class="routerHandle"></div><div class="routerHint">この文をどうする？</div><button class="routeBtn" data-route="chatgpt">ChatGPT</button><button class="routeBtn" data-route="search">検索</button><button class="routeBtn" data-route="todo">TODO</button><button class="routeBtn" data-route="copy">コピー</button><button class="routeBtn" data-route="save">保存</button></div></div><div id="toast" class="toast">コピーしました</div>
<script>
const KEY='memo-v05-notes';const notesEl=document.getElementById('notes'),note=document.getElementById('note'),newBtn=document.getElementById('newBtn'),backBtn=document.getElementById('backBtn'),router=document.getElementById('router'),toast=document.getElementById('toast'),formatBar=document.getElementById('formatBar');let notes=load(),activeId=null,startX=0,startY=0,lastX=0,lastY=0,tracking=false;function load(){try{const v=JSON.parse(localStorage.getItem(KEY));return Array.isArray(v)?v:[]}catch(e){return[]}}function save(){localStorage.setItem(KEY,JSON.stringify(notes))}function uid(){return(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}function now(){return new Date().toISOString()}function cleanText(){return note.innerText.replace(/\u00a0/g,' ').replace(/\n+$/,'')}function firstLine(text){const line=(text||'').split(/\n/).find(v=>v.trim());return line?line.trim():'新しいメモ'}function restText(text){const lines=(text||'').split(/\n/),i=lines.findIndex(v=>v.trim());return i<0?'':lines.slice(i+1).join('\n').trim()}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function renderList(){const visible=[...notes].filter(n=>n.text.trim()).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));if(!visible.length){notesEl.innerHTML='<div class="empty">まだ何もありません</div>';return}notesEl.innerHTML=visible.map(n=>{const preview=restText(n.text);return`<div class="noteSwipe" data-id="${n.id}"><button class="deleteBtn" aria-label="削除">削除</button><article class="noteRow"><div class="noteTitle">${esc(firstLine(n.text))}</div>${preview?`<div class="notePreview">${esc(preview)}</div>`:''}</article></div>`}).join('');bindListRows()}function bindListRows(){let sx=0,sy=0,dragging=false,moved=false;notesEl.querySelectorAll('.noteSwipe').forEach(w=>{const row=w.querySelector('.noteRow'),del=w.querySelector('.deleteBtn');row.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;notesEl.querySelectorAll('.noteSwipe.open').forEach(o=>{if(o!==w)o.classList.remove('open')});sx=e.touches[0].clientX;sy=e.touches[0].clientY;dragging=true;moved=false},{passive:true});row.addEventListener('touchmove',e=>{if(!dragging||e.touches.length!==1)return;const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){moved=true;if(dx<0)e.preventDefault()}},{passive:false});row.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>Math.abs(dy)&&dx<-42){w.classList.add('open');return}if(Math.abs(dx)>Math.abs(dy)&&dx>28){w.classList.remove('open');return}if(!moved&&!w.classList.contains('open'))openEditor(w.dataset.id,false)},{passive:true});row.addEventListener('click',()=>{if(!('ontouchstart'in window))openEditor(w.dataset.id,false)});del.addEventListener('click',e=>{e.stopPropagation();notes=notes.filter(n=>n.id!==w.dataset.id);save();renderList();showToast('削除しました')})})}function placeCaretEnd(){const r=document.createRange();r.selectNodeContents(note);r.collapse(false);const s=window.getSelection();s.removeAllRanges();s.addRange(r)}function makeNote(){const t=now(),n={id:uid(),text:'',createdAt:t,updatedAt:t};notes.unshift(n);save();return n}function openEditor(id,isNew){let n=notes.find(x=>x.id===id);if(!n)n=makeNote();activeId=n.id;note.textContent=n.text;document.body.classList.add('editing');void note.offsetHeight;if(isNew){note.focus({preventScroll:true});placeCaretEnd()}updateKeyboardUI()}function startNew(e){if(e){e.preventDefault();e.stopPropagation()}openEditor(null,true)}function flush(){if(!activeId)return;const n=notes.find(x=>x.id===activeId);if(!n)return;const text=cleanText();if(n.text!==text){n.text=text;n.updatedAt=now();save()}}function showRouter(){if(!activeId||router.classList.contains('show'))return;flush();note.blur();router.classList.add('show');router.setAttribute('aria-hidden','false')}function hideRouter(){router.classList.remove('show');router.setAttribute('aria-hidden','true')}function finishToList(){flush();const n=notes.find(x=>x.id===activeId);if(n&&!n.text.trim())notes=notes.filter(x=>x.id!==activeId);save();hideRouter();activeId=null;document.body.classList.remove('editing','keyboard');note.blur();renderList()}function backToList(e){if(e)e.preventDefault();finishToList()}function currentText(){flush();return notes.find(x=>x.id===activeId)?.text||''}function showToast(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1100)}async function copyText(text){try{await navigator.clipboard.writeText(text);return true}catch(e){try{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}catch(_){return false}}}async function routeAction(route){const text=currentText();if(route==='copy'){const ok=await copyText(text);if(ok){hideRouter();showToast('コピーしました');setTimeout(finishToList,280)}else showToast('コピーできませんでした');return}if(route==='save'){finishToList();return}hideRouter();showToast(route==='chatgpt'?'ChatGPT（テスト）':route==='search'?'検索（テスト）':'TODO（テスト）');setTimeout(()=>{note.focus({preventScroll:true})},350)}function insertAtCaret(text){note.focus({preventScroll:true});const s=window.getSelection();if(!s.rangeCount||!note.contains(s.anchorNode)){placeCaretEnd()}const sel=window.getSelection(),r=sel.getRangeAt(0);r.deleteContents();const tn=document.createTextNode(text);r.insertNode(tn);r.setStartAfter(tn);r.collapse(true);sel.removeAllRanges();sel.addRange(r);note.dispatchEvent(new Event('input',{bubbles:true}))}function toolAction(type){if(type==='todo')insertAtCaret('\n○');if(type==='space')insertAtCaret('\n\n');if(type==='underscore')insertAtCaret('_')}function updateKeyboardUI(){const vv=window.visualViewport;if(!document.body.classList.contains('editing'))return;let bottom=8,open=false;if(vv){const obscured=Math.max(0,window.innerHeight-vv.height-vv.offsetTop);bottom=obscured+8;open=obscured>120}else{open=document.activeElement===note;bottom=56}formatBar.style.bottom=bottom+'px';document.body.classList.toggle('keyboard',open&&document.activeElement===note)}note.addEventListener('focus',()=>setTimeout(updateKeyboardUI,30));note.addEventListener('blur',()=>setTimeout(updateKeyboardUI,30));note.addEventListener('input',()=>{if(!activeId)return;const n=notes.find(x=>x.id===activeId);if(!n)return;n.text=cleanText();n.updatedAt=now();save()});newBtn.addEventListener('touchend',startNew,{passive:false});newBtn.addEventListener('click',e=>{if(!('ontouchstart'in window))startNew(e)});backBtn.addEventListener('touchend',backToList,{passive:false});backBtn.addEventListener('click',e=>{if(!('ontouchstart'in window))backToList(e)});document.addEventListener('touchstart',e=>{if(e.target.closest&&e.target.closest('#formatBar'))return;if(!document.body.classList.contains('editing')||router.classList.contains('show')||e.touches.length!==1)return;const t=e.touches[0];startX=lastX=t.clientX;startY=lastY=t.clientY;tracking=startX>window.innerWidth*.42},{capture:true,passive:true});document.addEventListener('touchmove',e=>{if(!tracking||e.touches.length!==1)return;const t=e.touches[0];lastX=t.clientX;lastY=t.clientY;const dx=lastX-startX,dy=lastY-startY;if(dx<-34&&Math.abs(dx)>Math.abs(dy)*1.15)e.preventDefault()},{capture:true,passive:false});document.addEventListener('touchend',e=>{if(!tracking)return;tracking=false;if(e.changedTouches.length){lastX=e.changedTouches[0].clientX;lastY=e.changedTouches[0].clientY}const dx=lastX-startX,dy=lastY-startY;if(dx<-48&&Math.abs(dx)>Math.abs(dy)*1.15)showRouter()},{capture:true,passive:true});document.addEventListener('touchcancel',()=>tracking=false,{capture:true,passive:true});document.querySelectorAll('.routeBtn').forEach(b=>b.addEventListener('click',()=>routeAction(b.dataset.route)));document.querySelectorAll('.formatBtn').forEach(b=>{b.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();toolAction(b.dataset.insert)},{passive:false});b.addEventListener('mousedown',e=>e.preventDefault());b.addEventListener('click',e=>{if(!('ontouchstart'in window)){e.preventDefault();toolAction(b.dataset.insert)}})});router.addEventListener('click',e=>{if(e.target===router){hideRouter();note.focus({preventScroll:true})}});if(window.visualViewport){visualViewport.addEventListener('resize',updateKeyboardUI);visualViewport.addEventListener('scroll',updateKeyboardUI)}window.addEventListener('resize',updateKeyboardUI);document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});window.addEventListener('pagehide',flush);renderList();
</script></body></html>
