<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>memo v0.3</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#fff;color:#1d1d1f;-webkit-font-smoothing:antialiased}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Yu Gothic",sans-serif;background:#fff}
main{min-height:100vh;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 40px);background:#fff}
.meta{height:22px;margin:0 0 14px;font-size:12px;line-height:22px;color:#9b9b9f;font-weight:400}
textarea{
  display:block;width:100%;margin:0;padding:0;border:0;outline:0;resize:none;overflow:hidden;
  background:transparent;color:#1d1d1f;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Yu Gothic",sans-serif;
  font-size:17px;line-height:22px;font-weight:400;letter-spacing:0;
  caret-color:#1d1d1f;
  -webkit-text-size-adjust:100%;
  -webkit-appearance:none;appearance:none;
  -webkit-touch-callout:none;
}
textarea:focus,textarea:active{background:transparent!important;outline:none!important;box-shadow:none!important}
textarea::placeholder{color:#c7c7cc}
@media (min-width:700px){main{max-width:700px;margin:0 auto;padding-left:28px;padding-right:28px}}
</style>
</head>
<body>
<main>
  <div class="meta" id="date"></div>
  <textarea id="note" enterkeyhint="enter" inputmode="text" autocapitalize="sentences" autocomplete="off" spellcheck="false" aria-label="メモ"></textarea>
</main>
<script>
const note=document.getElementById('note');
const date=document.getElementById('date');
const KEY='memo-v03-draft';
date.textContent=new Intl.DateTimeFormat('ja-JP',{month:'long',day:'numeric',weekday:'short'}).format(new Date());
note.value=localStorage.getItem(KEY)||'';

/* iOSのキーボード表示で100dvh/innerHeightが変化すると、
   textareaの矩形そのものが再合成される瞬間に灰色〜黒っぽく見えることがある。
   そこで入力欄の基準高はページを開いた瞬間の高さで固定する。 */
const baseEditorHeight=Math.max(220, window.innerHeight-110);
function grow(){
  note.style.height='1px';
  note.style.height=Math.max(baseEditorHeight,note.scrollHeight)+'px';
}

note.addEventListener('input',()=>{
  localStorage.setItem(KEY,note.value);
  grow();
});

grow();
</script>
</body>
</html>
