<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>memo</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#fff;color:#1d1d1f;-webkit-font-smoothing:antialiased}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Yu Gothic",sans-serif}
button{font:inherit;border:0;background:none;color:inherit;padding:0}
[hidden]{display:none!important}
.view{min-height:100vh;background:#fff}
#listView{padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 100px)}
.listHeader{margin-bottom:25px}
.listHeader h1{margin:0;font-size:30px;line-height:1;font-weight:650;letter-spacing:-.035em}
#notes{border-top:1px solid #f0f0f1}
.noteRow{padding:18px 0;border-bottom:1px solid #f0f0f1;cursor:pointer}
.noteTitle{font-size:17px;line-height:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}
.notePreview{font-size:14px;line-height:20px;color:#85858a;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.empty{padding:80px 0;text-align:center;font-size:14px;color:#b5b5b9}
#editorView{padding:calc(env(safe-area-inset-top) + 22px) 18px calc(env(safe-area-inset-bottom) + 100px)}
#note{display:block;width:100%;min-height:75vh;margin:0;padding:0;border:0;outline:0;background:transparent;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Yu Gothic",sans-serif;font-size:17px;line-height:22px;font-weight:400;letter-spacing:0;caret-color:#1d1d1f;white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text;-webkit-text-size-adjust:100%}
#note:empty::before{content:''}
.action{position:fixed;z-index:10;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 17px);min-width:54px;height:48px;padding:0 18px;border-radius:24px;background:rgba(246,246,247,.96);font-size:22px;line-height:48px;text-align:center;color:#4d4d52;box-shadow:0 1px 7px rgba(0,0,0,.07);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.action.back{font-size:25px;font-weight:300}
@media (min-width:700px){#editorView,#listView{max-width:700px;margin:0 auto;padding-left:28px;padding-right:28px}}
</style>
</head>
<body>
<section id="listView" class="view">
  <div class="listHeader"><h1>メモ</h1></div>
  <div id="notes"></div>
  <button class="action" id="newBtn" aria-label="新規メモ">＋</button>
</section>
<section id="editorView" class="view" hidden>
  <div id="note" contenteditable="true" role="textbox" aria-multiline="true" inputmode="text" autocapitalize="sentences" spellcheck="false" aria-label="メモ"></div>
  <button class="action back" id="backBtn" aria-label="一覧へ戻る">‹</button>
</section>
<script>
const KEY='memo-v05-notes';
const listView=document.getElementById('listView'),editorView=document.getElementById('editorView'),notesEl=document.getElementById('notes'),note=document.getElementById('note'),newBtn=document.getElementById('newBtn'),backBtn=document.getElementById('backBtn');
let notes=load(),activeId=null;
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));return Array.isArray(v)?v:[]}catch(e){return []}}
function save(){localStorage.setItem(KEY,JSON.stringify(notes))}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
function now(){return new Date().toISOString()}
function cleanText(){return note.innerText.replace(/\u00a0/g,' ').replace(/\n+$/,'')}
function firstLine(text){const line=(text||'').split(/\n/).find(v=>v.trim());return line?line.trim():'新しいメモ'}
function restText(text){const lines=(text||'').split(/\n/);const i=lines.findIndex(v=>v.trim());if(i<0)return '';return lines.slice(i+1).join('\n').trim()}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderList(){const visible=[...notes].filter(n=>n.text.trim()).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));if(!visible.length){notesEl.innerHTML='<div class="empty">まだ何もありません</div>';return}notesEl.innerHTML=visible.map(n=>{const preview=restText(n.text);return `<article class="noteRow" data-id="${n.id}"><div class="noteTitle">${esc(firstLine(n.text))}</div>${preview?`<div class="notePreview">${esc(preview)}</div>`:''}</article>`}).join('');notesEl.querySelectorAll('.noteRow').forEach(el=>el.addEventListener('click',()=>openEditor(el.dataset.id,false)))}
function openEditor(id,isNew){let n=notes.find(x=>x.id===id);if(!n){const t=now();n={id:uid(),text:'',createdAt:t,updatedAt:t};notes.unshift(n);save()}activeId=n.id;note.textContent=n.text;listView.hidden=true;editorView.hidden=false;if(isNew){setTimeout(()=>{note.focus({preventScroll:true});const r=document.createRange();r.selectNodeContents(note);r.collapse(false);const s=window.getSelection();s.removeAllRanges();s.addRange(r)},80)}}
function flush(){if(!activeId)return;const n=notes.find(x=>x.id===activeId);if(!n)return;const text=cleanText();if(n.text!==text){n.text=text;n.updatedAt=now();save()}}
function backToList(){flush();const n=notes.find(x=>x.id===activeId);if(n&&!n.text.trim())notes=notes.filter(x=>x.id!==activeId);save();activeId=null;editorView.hidden=true;listView.hidden=false;renderList()}
note.addEventListener('input',()=>{if(!activeId)return;const n=notes.find(x=>x.id===activeId);if(!n)return;n.text=cleanText();n.updatedAt=now();save()});
newBtn.addEventListener('click',()=>openEditor(null,true));backBtn.addEventListener('click',backToList);document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});window.addEventListener('pagehide',flush);renderList();
</script>
</body>
</html>
