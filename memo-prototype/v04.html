<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>memo v0.4</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#fff;color:#1d1d1f;-webkit-font-smoothing:antialiased}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Yu Gothic",sans-serif}
main{min-height:100vh;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 40px);background:#fff}
.meta{height:22px;margin:0 0 14px;font-size:12px;line-height:22px;color:#9b9b9f;font-weight:400}
#note{
  display:block;width:100%;min-height:70vh;margin:0;padding:0;border:0;outline:0;background:transparent;color:#1d1d1f;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Yu Gothic",sans-serif;
  font-size:17px;line-height:22px;font-weight:400;letter-spacing:0;
  caret-color:#1d1d1f;white-space:pre-wrap;word-break:break-word;
  -webkit-user-select:text;user-select:text;-webkit-text-size-adjust:100%;
}
#note:empty::before{content:''}
@media (min-width:700px){main{max-width:700px;margin:0 auto;padding-left:28px;padding-right:28px}}
</style>
</head>
<body>
<main>
  <div class="meta" id="date"></div>
  <div id="note" contenteditable="true" role="textbox" aria-multiline="true" inputmode="text" autocapitalize="sentences" spellcheck="false" aria-label="メモ"></div>
</main>
<script>
const note=document.getElementById('note');
const date=document.getElementById('date');
const KEY='memo-v04-draft';
date.textContent=new Intl.DateTimeFormat('ja-JP',{month:'long',day:'numeric',weekday:'short'}).format(new Date());
const saved=localStorage.getItem(KEY)||'';
if(saved) note.textContent=saved;
note.addEventListener('input',()=>{
  localStorage.setItem(KEY,note.innerText.replace(/\u00a0/g,' '));
});
</script>
</body>
</html>
