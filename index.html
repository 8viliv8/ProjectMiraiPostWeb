<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Project Mirai Post</title>

<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">

</head>

<body>

<div class="container">

<h1>Project Mirai Post</h1>

<p>
世界へ断片を投函する場所
</p>

<div id="authArea">
  <button id="btnSignIn">🔒 ログインして投函する</button>
  <div id="authWho" style="display:none"></div>
</div>

<textarea id="body"
          placeholder="思いついたことを、そのまま書く。整った文章でなくて大丈夫です。"></textarea>

<button id="btnPost" disabled>投函</button>

<p id="status"></p>

<div id="resultCard" style="display:none"></div>

</div>

<script type="module" src="app.js"></script>
<script>

if ("serviceWorker" in navigator) {

navigator.serviceWorker.register(
"service-worker.js"
);

}

</script>
</body>

</html>
