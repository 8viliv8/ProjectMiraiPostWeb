<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H°me</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<meta name="apple-mobile-web-app-title" content="H°me">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFAF8;
    --surface:#FFFFFF;
    --border:#EAE7E1;
    --ink:#2C2E31;
    --dim:#8E8B82;
    --accent:#6E9BB8;
    --mono:'JetBrains Mono',monospace;
    --ui:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;

    --idea:#A8757F;
    --nichijo:#6E828C;
    --kaji:#7C8A6E;
    --shigoto:#8C7A5C;
  }
  /* ページ間の行き来を、対応ブラウザ(Chrome/Edge最新版・Safari 18.2以降)でクロスフェードにする。
     未対応の環境では、これまで通り普通の画面切り替えになるだけで、悪化はしない。 */
  @view-transition{ navigation: auto; }
  *{box-sizing:border-box}
  button, input, textarea{-webkit-appearance:none;appearance:none;font:inherit}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--ui);
    min-height:100vh;
  }
  .wrap{max-width:640px;margin:0 auto;padding:36px 20px 100px}

  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:28px}
  header h1{font-size:15px;font-weight:500;letter-spacing:.02em;margin:0}
  header h1 span{color:var(--dim);font-weight:400;font-size:12px;margin-left:8px}
  .bubble-icon{vertical-align:-2px;color:var(--dim)}
  .fish-icon{vertical-align:-1px;color:var(--dim);margin-left:6px}
  .tankFrame{
    display:inline-block;border:1px solid var(--border);border-radius:3px;
    padding:3px 10px;
  }
  .tank-icon{vertical-align:-2px;color:var(--dim);margin:0 2px}

  #universeLink{
    font-family:var(--mono);font-size:11px;letter-spacing:.05em;
    color:var(--dim);text-decoration:none;border:1px solid var(--border);
    border-radius:6px;padding:6px 12px;transition:.2s;
  }
  #universeLink:hover{color:var(--ink);border-color:var(--accent);background:var(--surface)}
  @keyframes bubbleBlink{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.4)} }
  #noteCircle.blink{ animation: bubbleBlink .22s ease-in-out; }

  /* ---------- 入力欄：ウィンドウ風カード（白基調） ---------- */
  #inputCard{
    background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;
    box-shadow:0 12px 30px -18px rgba(0,0,0,.12);
    margin-bottom:34px;
  }
  #inputCard .bar{
    display:flex;align-items:center;justify-content:space-between;gap:6px;
    padding:10px 12px;background:#EFEDE7;border-bottom:1px solid var(--border);
  }
  #inputCard .barLeft{display:flex;align-items:center}
  #inputCard .barRight{display:flex;align-items:center;gap:6px}
  #noteCircle{
    width:12px;height:12px;border-radius:50%;
    border:1.6px solid var(--dim);background:transparent;
    transition:background .2s,border-color .2s;
  }
  #inputCard .dot{
    width:9px;height:9px;border-radius:50%;cursor:pointer;transition:transform .15s;
    padding:7px;background-clip:content-box;box-sizing:content-box;
    display:inline-flex;align-items:center;justify-content:center;
  }
  #inputCard .dot:hover{transform:scale(1.15)}
  #inputCard .dot.r{background:#B37D6E}
  #inputCard .dot.y{background:#C4A05A}
  #inputCard .dot.n{background:#D8D5CC}
  #inputCard .dot.active{box-shadow:0 0 0 3px rgba(0,0,0,.08)}
  #clearTemplate{
    display:none;font-family:var(--mono);font-size:10px;color:var(--dim);
    cursor:pointer;margin-left:8px;white-space:nowrap;flex:none;
  }
  #saveTemplate{
    display:inline-flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:10px;color:var(--ink);
    background:#fff;border:1px solid var(--accent);border-radius:999px;
    padding:4px 12px;cursor:pointer;margin-left:8px;transition:transform .15s,background .15s;
    white-space:nowrap;flex:none;
  }
  #saveTemplate:hover{transform:scale(1.05);background:var(--surface)}
  #inputCard.expanded #clearTemplate{display:inline}
  #inputCard.collapsed textarea{min-height:20px!important;max-height:20px;overflow:hidden}
  #inputCard.expanded textarea{min-height:120px}
  #inputCard.expanded #memoInput{min-height:80px}

  /* ---------- スマホ幅では、テンプレート使用中だけ全画面に広げる ---------- */
  @media (max-width: 600px){
    #inputCard .dot{padding:9px}
    #inputCard.expanded{
      position:fixed;inset:0;z-index:50;border-radius:0;
      display:flex;flex-direction:column;overflow-y:auto;
    }
    #inputCard.expanded .body{flex:1;padding-bottom:40px}
  }

  /* ---------- 構造化フィールド：ラベルは固定・編集不可（罫線扱い） ---------- */
  #structuredFields{
    display:none;
    margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);
  }
  #inputCard.expanded #structuredFields{display:block}
  .field{margin-bottom:14px}
  .field:last-child{margin-bottom:0}
  .flabel{
    font-family:var(--mono);font-size:10px;letter-spacing:.12em;
    color:#B4B0A6;user-select:none;pointer-events:none;
    margin-bottom:4px;
  }
  .field input, .field textarea{
    width:100%;border:none;outline:none;resize:none;background:transparent;
    font-family:var(--ui);font-size:13px;color:var(--ink);line-height:1.7;
  }
  .field input::placeholder, .field textarea::placeholder{color:#C7C3B8}
  #inputCard .body{padding:16px 18px 18px}
  #inputCard .prompt{
    display:flex;gap:10px;align-items:flex-start;
    font-family:var(--mono);font-size:13px;color:var(--ink);
  }
  #memoTitleInput{
    width:100%;border:none;outline:none;background:transparent;
    font-family:var(--ui);font-size:14px;font-weight:500;color:var(--ink);
    padding:0;
  }
  #memoTitleInput::placeholder{color:#B4B0A6;font-weight:400}
  #memoBodyWrap{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}
  #defaultSplit.revealed #memoBodyWrap{display:block}
  #defaultSplit.plainMode #memoTitleInput{display:none}
  #defaultSplit.plainMode #memoBodyWrap{margin-top:0;padding-top:0;border-top:none}
  #inputCard textarea{
    width:100%;box-sizing:border-box;background:transparent;border:none;outline:none;resize:none;
    color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.7;
    min-height:22px;max-height:180px;
  }
  @media (max-width: 600px){
    /* iOSは16px未満の入力欄をタップすると自動でズームしてしまうため、
       スマホ幅の時だけ16pxに引き上げてズームを防ぐ */
    #inputCard textarea, #inputCard input,
    #structuredFields textarea, #structuredFields input,
    #searchInput, #readViewBody.editing .rvField{
      font-size:16px !important;
    }
  }
  #inputCard textarea::placeholder{color:#B4B0A6}
  #inputCard .foot{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:10px;font-family:var(--mono);font-size:10px;color:var(--dim);
  }
  #inputCard button{
    font-family:var(--mono);font-size:11px;letter-spacing:.05em;
    background:var(--accent);color:#fff;border:none;border-radius:5px;
    padding:6px 14px;cursor:pointer;transition:opacity .2s;
  }
  #inputCard button:hover{opacity:.85}
  #inputCard button:disabled{opacity:.35;cursor:default}

  /* ---------- 認証 ---------- */
  #authRow{
    position:fixed;top:14px;right:16px;z-index:30;
    display:flex;align-items:center;gap:8px;font-size:9px;color:var(--dim);
    opacity:.55;transition:opacity .2s;
  }
  #authRow:hover{opacity:1}
  #authRow button{
    -webkit-appearance:none;appearance:none;font:inherit;
    font-family:var(--ui);font-size:9px;color:var(--dim);
    background:none;border:1px solid var(--border);border-radius:6px;
    padding:3px 8px;cursor:pointer;
  }
  #authRow button:hover{border-color:var(--accent);color:var(--ink)}
  #authWho{
    cursor:pointer;display:flex;align-items:center;gap:5px;
    background:var(--surface);border:1px solid var(--accent);border-radius:999px;
    padding:3px 9px;color:var(--ink);font-size:9px;
  }
  #authWho::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--accent);display:inline-block}

  /* ---------- 一覧 ---------- */
  #list{display:flex;flex-direction:column;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .card{
    background:var(--surface);padding:16px 18px;cursor:default;
    display:flex;flex-direction:column;gap:6px;
  }
  .card .row1{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .card .row1 .left{display:flex;align-items:center;gap:9px;min-width:0}
  .card .titleCircle{width:9px;height:9px;border-radius:50%;flex:none}
  .card .title{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .sub{font-size:12px;color:var(--dim);line-height:1.6}
  .card .meta{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:9.5px;color:var(--dim)}
  .qtag{
    display:inline-flex;align-items:center;gap:5px;
    border:1px solid var(--border);border-radius:999px;
    padding:2px 9px;font-family:var(--mono);font-size:9.5px;color:var(--dim);
    cursor:pointer;user-select:none;background:#fff;
  }
  .qtag i{width:6px;height:6px;border-radius:50%}
  .rowActions{display:flex;align-items:center;gap:8px;flex:none}
  .qtagView{
    display:inline-flex;align-items:center;gap:5px;
    border:1px solid var(--border);border-radius:999px;
    padding:2px 9px;font-family:var(--mono);font-size:9.5px;color:var(--dim);
    background:#fff;
  }
  .qtagView i{width:6px;height:6px;border-radius:50%}
  .cardDeleteBtn{
    font-family:var(--mono);font-size:15px;color:var(--dim);cursor:pointer;
    padding:2px 4px;line-height:1;flex:none;min-width:16px;text-align:center;
  }
  .cardDeleteBtn:hover{color:#B15C4F}
  .qtag[data-q="idea"] i{background:var(--idea)}
  .qtag[data-q="nichijo"] i{background:var(--nichijo)}
  .qtag[data-q="kaji"] i{background:var(--kaji)}
  .qtag[data-q="shigoto"] i{background:var(--shigoto)}

  .qmenu{position:absolute;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 12px 30px -10px rgba(0,0,0,.25);overflow-y:auto;max-height:260px;z-index:100;display:none}
  .qmenu.open{display:block}
  .qmenu div{padding:7px 14px;font-family:var(--mono);font-size:11px;display:flex;align-items:center;gap:8px;cursor:pointer}
  .qmenu div:hover{background:var(--bg)}
  .qmenu i{width:6px;height:6px;border-radius:50%}
  .qmenu i.circleIcon{background:none;border:1px solid var(--dim)}

  /* ---------- カスタムダイアログ（prompt/confirmの置き換え） ---------- */
  #dialogOverlay{
    position:fixed;inset:0;background:rgba(251,250,248,.75);
    display:none;align-items:center;justify-content:center;z-index:60;
    backdrop-filter:blur(2px);
  }
  #dialogOverlay.open{display:flex}
  #dialogBox{
    width:min(320px,88vw);background:var(--surface);border:1px solid var(--border);
    border-radius:10px;padding:20px;box-shadow:0 30px 70px -20px rgba(0,0,0,.25);
  }
  #dialogMessage{font-size:13px;color:var(--ink);line-height:1.7;margin-bottom:14px}
  #dialogInput{
    width:100%;border:1px solid var(--border);border-radius:6px;
    padding:8px 10px;font-family:var(--ui);font-size:13px;color:var(--ink);
    outline:none;margin-bottom:14px;background:#fff;
  }
  #dialogActions{display:flex;justify-content:flex-end;gap:8px}
  #dialogActions button{
    font-family:var(--mono);font-size:11px;color:var(--dim);background:none;
    border:1px solid var(--border);border-radius:6px;padding:6px 14px;cursor:pointer;
  }
  #dialogOk{color:#fff!important;background:var(--accent)!important;border-color:var(--accent)!important}

  /* ---------- AI提案：右端の開閉タブ ---------- */
  #aiSuggestTab{
    position:fixed;right:0;top:50%;transform:translateY(-50%);
    z-index:45;width:20px;height:46px;
    background:var(--surface);border:1px solid var(--border);border-right:none;
    border-radius:8px 0 0 8px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--dim);font-size:11px;
    box-shadow:-4px 0 14px -8px rgba(0,0,0,.15);
  }
  #aiSuggestTab.blink{animation:aiTabBlink 1.1s ease-in-out infinite}
  @keyframes aiTabBlink{50%{opacity:.3}}
  #aiSuggestPanel{
    position:fixed;right:20px;top:50%;
    transform:translateY(-50%) translateX(12px);
    z-index:44;width:min(280px,78vw);
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
    box-shadow:0 20px 50px -20px rgba(0,0,0,.25);
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  }
  #aiSuggestPanel.open{opacity:1;pointer-events:auto;transform:translateY(-50%) translateX(0)}
  #aiSuggestPanel .bar{padding:9px 12px;background:#EFEDE7;border-bottom:1px solid var(--border);border-radius:10px 10px 0 0}
  #aiSuggestPanel .dotrow span{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
  #aiSuggestPanel .body{padding:14px 16px}
  #aiSuggestCombo{font-size:12px;color:var(--ink);line-height:1.7;min-height:36px}
  #aiSuggestPanel .actions{display:flex;gap:10px;margin-top:12px;justify-content:flex-end}
  #aiSuggestSkip, #aiSuggestAdopt{
    font-size:14px;cursor:pointer;width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--border);color:var(--dim);
  }
  #aiSuggestAdopt:hover{border-color:var(--accent);color:var(--accent)}
  #aiSuggestSkip:hover{border-color:#B15C4F;color:#B15C4F}

  /* ---------- プール詳細（タイトルクリックで開く） ---------- */
  #poolOverlay{
    position:fixed;inset:0;background:rgba(251,250,248,.85);
    display:none;align-items:center;justify-content:center;z-index:55;
    backdrop-filter:blur(2px);
  }
  #poolOverlay.open{display:flex}
  #poolPanel{
    width:min(480px,92vw);max-height:80vh;overflow:auto;
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
    box-shadow:0 30px 70px -20px rgba(0,0,0,.25);
  }
  .poolHeader{
    display:flex;align-items:center;gap:8px;padding:14px 16px;
    border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);
    flex-wrap:nowrap;
  }
  #poolNameInput{
    flex:1;min-width:0;border:none;outline:none;background:transparent;
    font-family:var(--ui);font-size:14px;font-weight:500;color:var(--ink);
    padding:6px 4px;border-bottom:1px dashed transparent;
  }
  #poolNameInput:focus{border-bottom:1px dashed var(--accent)}
  #poolCloseBtn{font-family:var(--mono);font-size:11px;color:var(--dim);cursor:pointer;padding:6px 4px}
  #poolDeleteBtn{font-family:var(--mono);font-size:11px;color:#B15C4F;cursor:pointer;padding:6px 4px}
  #poolAutoBtn{font-family:var(--mono);font-size:11px;color:var(--accent);cursor:pointer;padding:6px 4px}
  #poolAutoBtnInline{
    position:absolute;right:10px;bottom:8px;
    font-family:var(--mono);font-size:9px;color:var(--accent);
    border:1px solid var(--border);border-radius:999px;
    padding:3px 9px;cursor:pointer;background:#fff;
  }
  #poolAutoBtnInline:hover{border-color:var(--accent)}
  #poolNoteList{padding:8px 16px 20px}
  .poolItem{padding:14px 4px;border-bottom:1px solid var(--border);display:flex;gap:12px}
  .poolItem .piBody{cursor:pointer}
  .poolItem .piTop{display:flex;justify-content:space-between;gap:10px;align-items:center}
  .poolItem .piTitleRow{display:flex;align-items:center;gap:7px}
  .poolItem .piCircle{width:8px;height:8px;border-radius:50%;flex:none}
  .poolItem .piTitle{font-size:13.5px;font-weight:500;color:var(--ink)}
  .poolItem .piDate{font-family:var(--mono);font-size:10px;color:var(--dim);white-space:nowrap}
  .piDeleteBtn{
    font-family:var(--mono);font-size:14px;color:var(--dim);cursor:pointer;
    padding:0 2px;line-height:1;flex:none;
  }
  .piDeleteBtn:hover{color:#B15C4F}
  .piSub{font-size:12px;color:var(--dim);line-height:1.6;margin-top:3px}
  #poolEmpty{color:var(--dim);font-size:12px;text-align:center;padding:30px 0}

  /* ---------- エクスポート（チェック選択・1枚にまとめる・md化・コピー） ---------- */
  #poolExportBar{
    display:flex;align-items:center;gap:10px;flex-wrap:nowrap;overflow-x:auto;
    padding:10px 16px;border-bottom:1px solid var(--border);
    font-family:var(--mono);font-size:11px;color:var(--dim);
  }
  #poolSelectAllLabel{display:flex;align-items:center;gap:5px;cursor:pointer;flex:none}
  .exportBtn{
    border:1px solid var(--border);border-radius:999px;
    padding:4px 10px;cursor:pointer;color:var(--dim);flex:none;white-space:nowrap;
  }
  .exportBtn:hover{border-color:var(--accent);color:var(--ink)}
  .piCheck{
    margin-top:3px;flex:none;width:14px;height:14px;
    border:1.3px solid var(--border);border-radius:3px;
    cursor:pointer;position:relative;background:#fff;display:inline-block;
  }
  .piCheck::before{content:'';position:absolute;inset:-10px}
  .piCheck.checked{background:var(--accent);border-color:var(--accent)}
  .piCheck.checked::after{
    content:'';position:absolute;left:4px;top:1px;width:4px;height:8px;
    border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(45deg);
  }
  .poolItem .piCheck{display:none}
  #poolNoteList.selectMode .poolItem .piCheck{display:inline-block}
  .poolItem .piBody{flex:1}
  .piMeta{margin-top:4px}
  .piMeta .piDate{font-family:var(--mono);font-size:10px;color:var(--dim);white-space:nowrap}

  .poolHeaderTitle{display:flex;align-items:center;gap:8px}
  .poolHeaderCircle{width:9px;height:9px;border-radius:50%;flex:none}

  #combinedOverlay{
    position:fixed;inset:0;background:rgba(251,250,248,.85);
    display:none;align-items:center;justify-content:center;z-index:56;
    backdrop-filter:blur(2px);
  }
  #combinedOverlay.open{display:flex}
  #combinedPanel{
    width:min(560px,92vw);max-height:82vh;overflow:auto;
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
    box-shadow:0 30px 70px -20px rgba(0,0,0,.25);
  }
  #combinedBody{padding:20px 22px;font-size:13px;line-height:1.9;color:var(--ink)}
  #combinedBody h2{font-size:14px;font-weight:500;margin:0 0 4px 0}
  #combinedBody .cbDate{font-family:var(--mono);font-size:10px;color:var(--dim);margin-bottom:10px}
  #combinedBody h3{font-size:11px;color:var(--dim);font-weight:500;letter-spacing:.05em;margin:12px 0 3px 0}
  #combinedBody p{margin:0 0 4px 0;white-space:pre-wrap}
  #combinedBody hr{border:none;border-top:1px dashed var(--border);margin:22px 0}

  #readViewOverlay{
    position:fixed;inset:0;background:rgba(251,250,248,.85);
    display:none;justify-content:center;z-index:56;
    padding-top:8vh;
    backdrop-filter:blur(2px);
  }
  #readViewOverlay.open{display:flex}
  #readViewPanel{
    width:min(520px,92vw);max-height:80vh;overflow:auto;height:fit-content;
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
    box-shadow:0 30px 70px -20px rgba(0,0,0,.25);
  }
  #readViewEditBtn{font-family:var(--mono);font-size:11px;color:var(--accent);cursor:pointer}
  #readViewCopyBtn{font-family:var(--mono);font-size:11px;color:var(--dim);cursor:pointer}
  #readViewCopyBtn:hover{color:var(--ink)}
  #readViewDeleteBtn{font-family:var(--mono);font-size:11px;color:#B15C4F;cursor:pointer}
  #readViewCloseBtn{font-family:var(--mono);font-size:11px;color:var(--dim);cursor:pointer}
  #readViewBody{padding:20px 22px;font-size:13px;line-height:1.9;color:var(--ink);cursor:pointer}
  #readViewBody.editing{cursor:default}
  #readViewBody h2{font-size:15px;font-weight:500;margin:0 0 4px 0;outline:none}
  #readViewBody .cbDate{font-family:var(--mono);font-size:10px;color:var(--dim);margin-bottom:14px}
  #readViewBody h3{font-size:11px;color:var(--dim);font-weight:500;letter-spacing:.05em;margin:14px 0 3px 0}

const dialogOverlay = $('dialogOverlay'), dialogMessage = $('dialogMessage'),
      dialogInput = $('dialogInput'), dialogOk = $('dialogOk'), dialogCancel = $('dialogCancel');

function showDialog({ message, withInput = false, defaultValue = '' }){
  return new Promise((resolve) => {
    dialogMessage.textContent = message;
    dialogInput.style.display = withInput ? 'block' : 'none';
    dialogInput.value = defaultValue;
    dialogOverlay.classList.add('open');
    if(withInput) setTimeout(() => dialogInput.focus(), 50);

    function cleanup(result){
      dialogOverlay.classList.remove('open');
      dialogOk.removeEventListener('click', onOk);
      dialogCancel.removeEventListener('click', onCancel);
      dialogInput.removeEventListener('keydown', onKey);
      resolve(result);
    }
    function onOk(){ cleanup(withInput ? dialogInput.value.trim() : true); }
    function onCancel(){ cleanup(withInput ? null : false); }
    function onKey(e){ if(e.key === 'Enter'){ e.preventDefault(); onOk(); } }
    dialogOk.addEventListener('click', onOk);
    dialogCancel.addEventListener('click', onCancel);
    dialogInput.addEventListener('keydown', onKey);
  });
}
function customConfirm(message){ return showDialog({ message }); }
function customPrompt(message, defaultValue=''){ return showDialog({ message, withInput:true, defaultValue }); }
const listEl = $('list'), emptyEl = $('empty');

const btnSignIn = $('btnSignIn'), authWho = $('authWho');

function fmtDate(iso){
  try{
    const d = new Date(iso);
    return d.toISOString().slice(0,10).replace(/-/g,'.');
  }catch(e){ return ''; }
}
function fmtDateTime(iso){
  try{
    const d = new Date(iso);
    const datePart = d.toISOString().slice(0,10).replace(/-/g,'.');
    const timePart = String(d.getUTCHours()).padStart(2,'0') + ':' + String(d.getUTCMinutes()).padStart(2,'0');
    return `${datePart} ${timePart}`;
  }catch(e){ return ''; }
}

function preview(n){
  if(n.title){
    const sub = n.purpose || n.concept || '';
    return { title: n.title.slice(0,40), sub: sub.slice(0,80) };
  }
  const lines = (n.text || '').split('\n');
  const title = lines[0].slice(0, 40) || '(無題)';
  const rest = (lines.length > 1 ? lines.slice(1).join(' ') : lines[0].slice(40)).trim();
  return { title, sub: rest.slice(0, 80) };
}

let searchQuery = '';
function matchesSearch(n){
  if(!searchQuery) return true;
  const haystack = [n.title, n.text, n.purpose, n.concept, (n.keywords||[]).join(' ')]
    .filter(Boolean).join(' ').toLowerCase();
  return haystack.includes(searchQuery);
}

function renderFields(container, templateKey, values){
  const tpl = TEMPLATES[templateKey];
  container.innerHTML = '';
  if(!tpl) return;
  for(const f of tpl.fields){
    const wrap = document.createElement('div');
    wrap.className = 'field';
    const label = document.createElement('div');
    label.className = 'flabel';

    wrap.appendChild(label);
    const el = document.createElement(f.kind === 'textarea' ? 'textarea' : 'input');
    el.id = container.id + '_' + f.key;
    el.dataset.key = f.key;
    if(f.kind === 'textarea') el.rows = f.rows || 2;
    else el.type = 'text';
    el.placeholder = f.ph || '';
    el.value = (values && values[f.key]) || '';
    if(templateKey === 'list' && f.key === 'concept' && !el.value){
      el.value = '・';
      setTimeout(() => el.setSelectionRange(1,1), 0);
    }
    if(templateKey === 'list' && f.key === 'concept'){
      el.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' && !e.metaKey && !e.ctrlKey){
          e.preventDefault();
          const pos = el.selectionStart;
          const insert = '\n・';
          el.value = el.value.slice(0, pos) + insert + el.value.slice(pos);
          const newPos = pos + insert.length;
          el.setSelectionRange(newPos, newPos);
        }
      });
    }
    wrap.appendChild(el);
    container.appendChild(wrap);
  }
}

function readFields(container, templateKey){
  const out = {title:'', purpose:'', concept:'', keywords:[]};
  const tpl = TEMPLATES[templateKey];
  if(!tpl) return out;
  for(const f of tpl.fields){
    const el = document.getElementById(container.id + '_' + f.key);
    if(!el) continue;
    if(f.key === 'keywords') out.keywords = el.value.split(',').map(s=>s.trim()).filter(Boolean);
    else out[f.key] = el.value.trim();
  }
  return out;
}

function colorForCategory(categoryId){

  return idx>=0 ? palette[idx % palette.length] : '#C7C3B8';
}

/* ---------- 分類：既存システム（AI不使用）による自動振り分け ----------
   文字のNグラム（2文字の連なり）の重なり具合だけで類似度を測る、
   昔からある古典的な手法（Dice係数）。意味の理解はしていない。 */
function ngramSet(text, n=2){
  const clean = (text || '').replace(/\s+/g, '');
  const set = new Set();
  for(let i=0; i<=clean.length-n; i++) set.add(clean.slice(i, i+n));
  return set;
}
function diceSimilarity(a, b){
  const ga = ngramSet(a), gb = ngramSet(b);
  if(ga.size===0 || gb.size===0) return 0;
  let inter = 0;
  for(const g of ga) if(gb.has(g)) inter++;
  return (2*inter) / (ga.size + gb.size);
}
function noteFullText(n){
  return [n.title, n.text, n.purpose, n.concept, (n.keywords||[]).join(' ')].filter(Boolean).join(' ');
}
const SIMILARITY_THRESHOLD = 0.15; // 経験的な目安。厳密なチューニングはしていない

function autoClassify(note){
  const noteTxt = noteFullText(note);
  if(!noteTxt.trim()) return null;
  let best = null, bestScore = 0;
  for(const cat of categories){
    const members = notes.filter(n => !n.deleted && n.categoryId === cat.id && n.id !== note.id);
    for(const m of members){
      const score = diceSimilarity(noteTxt, noteFullText(m));
      if(score > bestScore){ bestScore = score; best = cat.id; }
    }
  }
  return bestScore >= SIMILARITY_THRESHOLD ? best : null;
}

function addMemo(){
  const text = memoInput.value.trim();
  const f = readFields(structuredFieldsEl, activeTemplate);
  const effectiveTitle = memoTitleInput.value.trim() || f.title;

  if(!currentUser) return;

  if(editingNoteId){
    // 編集中のメモを更新する（新規作成はしない）
    const note = notes.find(n => n.id === editingNoteId);
    if(note){
      if(!text && !effectiveTitle){
        // 空にして離れた場合は削除する（Keepと同じ挙動）
        softDeleteNote(editingNoteId);
      } else {
        note.text = text;
        note.type = activeTemplate;
        note.title = effectiveTitle; note.purpose = f.purpose; note.concept = f.concept; note.keywords = f.keywords;
        applyPoolChoice(note, false);
      }
      requestSave();
    }
    exitEditMode();
    render();
    return;
  }

  if(!text && !effectiveTitle) return; // 何も書かれていなければ何もしない

  const now = Date.now();
  const newNote = {
    id: 'memo_' + now.toString(36) + Math.random().toString(36).slice(2,5),
    tag: null,
    q: 'idea',            // 初期値。カードのタグをタップして後から変更できる
    t: now,
    text: text,
    sub: '',
    type: activeTemplate,
    title: effectiveTitle, purpose: f.purpose, concept: f.concept, keywords: f.keywords,
    categoryId: null,
    categoryManual: false,
    hybrid: null, tentative:false, born:null,
    createdAt: new Date(now).toISOString(),
  };
  applyPoolChoice(newNote, true);

  playConvergeEffect(newNote.categoryId, () => {
    notes.push(newNote);
    memoInput.value = '';
    memoTitleInput.value = '';
    activeTemplate = null;
    structuredFieldsEl.innerHTML = '';
    expanded = false; collapsed = false;
    inputCard.classList.remove('expanded','collapsed');
    document.querySelectorAll('#inputCard .dot').forEach(d=>d.classList.remove('active'));
    $('memoBodyWrap').style.display = '';
    $('defaultSplit').classList.remove('revealed', 'plainMode');
    memoInput.placeholder = '';
    resetPoolPicker(null);
    autoGrow();
    render();
    requestSave();
    memoTitleInput.focus(); // 続けて次のメモを書き始められるように
  });
}

function playConvergeEffect(categoryId, onDone, startEl){
  // 「メモ欄の左上の〇」(または指定された開始位置)が、内容を包み込みながら小さくなり、
  // 実際に着地するプール（未分類、または該当するプールの箱）へ向かって飛んでいく。
  const startRect = (startEl || noteCircleEl).getBoundingClientRect();

  const dot = document.createElement('div');
  dot.className = 'converge-dot';
  dot.style.left = startRect.left + 'px';
  dot.style.top  = startRect.top + 'px';
  dot.style.width  = startRect.width + 'px';
  dot.style.height = startRect.height + 'px';
  dot.style.opacity = '0.9';
  dot.style.background = categoryId ? colorForCategory(categoryId) : '#C7C3B8';
  document.body.appendChild(dot);

  const targetBox = categoryId
    ? categoriesEl.querySelector(`[data-cat="${categoryId}"]`)
    : poolEl;
  const targetRect = (targetBox || listEl).getBoundingClientRect();
  const targetX = targetRect.left + Math.min(24, targetRect.width/2);
  const targetY = targetRect.top + 22;

  requestAnimationFrame(() => {
    dot.style.left = (targetX - 4.5) + 'px';
    dot.style.top  = (targetY - 4.5) + 'px';
    dot.style.width  = '9px';
    dot.style.height = '9px';
  });

  setTimeout(() => {
    dot.remove();
    onDone();
  }, 560);
}

function toggleTemplate(key){

function updateRvPoolTag(note){

  rvPoolTagEl.querySelector('i').style.background = color;
  rvPoolTagTextEl.textContent = poolLabelForNote(note);

function renderNoteView(note, editable){
  readViewBodyEl.classList.toggle('editing', editable);
  const hasRealTitle = !!(note.title && note.title.trim());
  const ce = editable ? 'contenteditable="true"' : '';
  let html = `<h2 class="rvField" data-key="__title" data-placeholder="メモ" ${ce}>${escapeHtml(hasRealTitle ? note.title : '')}</h2>`;
  html += `<div class="cbDate">${fmtDateTime(note.createdAt || (note.t ? new Date(note.t).toISOString() : ''))}</div>`;

  const tpl = TEMPLATES[note.type];
  if(tpl && tpl.fields.length){
    for(const f of tpl.fields){
      if(f.key === 'title') continue;
      const val = f.key === 'keywords' ? (note.keywords||[]).join(', ') : (note[f.key] || '');
      if(!editable && !val) continue;
      html += `<h3>${escapeHtml(f.label)}</h3><p class="rvField" data-key="${f.key}" data-placeholder="（空欄）" ${ce}>${escapeHtml(val)}</p>`;
    }
    if(editable || note.text) html += `<h3>メモ</h3><p class="rvField" data-key="__text" data-placeholder="（空欄）" ${ce}>${escapeHtml(note.text||'')}</p>`;
  } else {
    if(editable || note.text) html += `<p class="rvField" data-key="__text" data-placeholder="（空欄）" ${ce}>${escapeHtml(note.text||'')}</p>`;
  }
  readViewBodyEl.innerHTML = html;
}

function openReadView(id){
  const note = notes.find(n => n.id === id);
  if(!note) return;
  readViewNoteId = id;
  readViewEditing = false;
  updateRvPoolTag(note);
  renderNoteView(note, false);
  readViewOverlayEl.classList.add('open');
}
readViewBodyEl.addEventListener('click', () => {

});

function enterEditMode(){
  const note = notes.find(n => n.id === readViewNoteId);
  if(!note) return;
  readViewEditing = true;
  renderNoteView(note, true);
  const titleEl = readViewBodyEl.querySelector('[data-key="__title"]');
  if(titleEl){ titleEl.focus(); placeCursorAtEnd(titleEl); }
}
function placeCursorAtEnd(el){
  const range = document.createRange();
  range.selectNodeContents(el);
  range.collapse(false);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

function saveReadViewEdits(){
  if(!readViewNoteId || !readViewEditing) return;
  const note = notes.find(n => n.id === readViewNoteId);
  if(!note) return;
  readViewBodyEl.querySelectorAll('.rvField').forEach(el => {
    const key = el.dataset.key;
    const val = el.textContent.trim();
    if(key === '__title') note.title = val;
    else if(key === '__text') note.text = val;
    else if(key === 'keywords') note.keywords = val.split(',').map(s=>s.trim()).filter(Boolean);
    else note[key] = val;
  });
  requestSave();
  render();
}

function closeReadView(){
  if(readViewEditing) saveReadViewEdits();
  readViewOverlayEl.classList.remove('open');
  readViewNoteId = null;
  readViewEditing = false;
}

function makeZDot(note){
  const dot = document.createElement('div');
  dot.className = 'zdot';
  dot.style.background = note.categoryId ? colorForCategory(note.categoryId) : '#C7C3B8';
  dot.title = (note.title || note.text || '').slice(0, 30);
  dot.draggable = true;
  dot.dataset.id = note.id;
  dot.addEventListener('dragstart', (e) => {
    e.dataTransfer.setData('text/plain', note.id);
    setTimeout(() => dot.classList.add('dragging'), 0);
  });
  dot.addEventListener('dragend', () => dot.classList.remove('dragging'));
  dot.addEventListener('click', () => openReadView(note.id));
  return dot;
}

function wireDropzone(el, categoryId){
  el.addEventListener('dragover', (e) => { e.preventDefault(); el.classList.add('dragover'); });
  el.addEventListener('dragleave', () => el.classList.remove('dragover'));
  el.addEventListener('drop', (e) => {
    e.preventDefault();
    el.classList.remove('dragover');
    const id = e.dataTransfer.getData('text/plain');
    const note = notes.find(n => n.id === id);
    if(note){
      note.categoryId = categoryId;
      requestSave();
      renderClassify();
    }
  });
}

function renderClassify(){
  const poolDots = poolEl.querySelector('.dots');
  poolDots.innerHTML = '';
  notes.filter(n => !n.deleted && !n.categoryId).forEach(n => poolDots.appendChild(makeZDot(n)));
  wireDropzone(poolEl, null);

  categoriesEl.innerHTML = '';
  const countOf = (cat) => notes.filter(n => !n.deleted && n.categoryId === cat.id).length;
  const sortedCats = [...categories].sort((a,b) => countOf(b) - countOf(a));
  sortedCats.forEach(cat => {
    const box = document.createElement('div');
    box.className = 'dropzone';
    box.dataset.cat = cat.id;
    box.style.cursor = 'pointer';
    box.innerHTML = `
      <div class="czlabel">
        <span class="catname">${escapeHtml(cat.name)}</span>
      </div>
      <div class="dots"></div>
    `;
    box.addEventListener('click', (e) => {
      if(e.target.closest('.zdot')) return; // 〇のクリックはそのメモのカードを開く（別ハンドラ）
      openPoolDetail(cat.id);
    });
    const dotsWrap = box.querySelector('.dots');
    notes.filter(n => !n.deleted && n.categoryId === cat.id).forEach(n => dotsWrap.appendChild(makeZDot(n)));
    wireDropzone(box, cat.id);
    categoriesEl.appendChild(box);
  });
}

/* ---------- まとめてエクスポート（テンプレートの項目名をそのまま見出しに使う） ---------- */
function noteToMarkdownSection(n){
  const hasRealTitle = !!(n.title && n.title.trim());
  const { title } = preview(n);
  const dateStr = fmtDateTime(n.createdAt || (n.t ? new Date(n.t).toISOString() : ''));
  const heading = hasRealTitle ? title : `メモ`;
  const lines = [`## ${heading} (${dateStr})`];
  const tpl = TEMPLATES[n.type];
  if(tpl){
    for(const f of tpl.fields){
      if(f.key === 'title') continue; // タイトルは見出しに使用済み
      const val = f.key === 'keywords' ? (n.keywords||[]).join(', ') : (n[f.key] || '');
      if(val) lines.push(`### ${f.label}`, val, '');
    }
    if(n.text) lines.push('### メモ', n.text, '');
  } else if(n.text){
    // タイトルが無く、見出し自体がこの本文の抜粋だった場合は、本文をここで一度だけ出す
    lines.push(n.text, '');
  }
  return lines.join('\n');
}

function renderTrash(){
  const deletedNotes = notes.filter(n => n.deleted).sort((a,b) => new Date(b.deletedAt||0) - new Date(a.deletedAt||0));
  $('trashEmpty').style.display = deletedNotes.length ? 'none' : 'block';
  trashListEl.innerHTML = deletedNotes.map(n => {
    const { title } = preview(n);
    return `
      <div class="trashItem" data-id="${n.id}">
        <span>${escapeHtml(title)}</span>
        <span class="tiActions">
          <span class="tiRestore" data-id="${n.id}">元に戻す</span>
          <span class="tiPurge" data-id="${n.id}">完全に削除</span>
        </span>
      </div>
    `;
  }).join('');
  trashListEl.querySelectorAll('.tiRestore').forEach(el => {
    el.addEventListener('click', () => {
      const note = notes.find(n => n.id === el.dataset.id);
      if(note){ note.deleted = false; note.deletedAt = null; requestSave(); render(); renderTrash(); }
    });
  });
  trashListEl.querySelectorAll('.tiPurge').forEach(el => {
    el.addEventListener('click', async () => {
      if(!await customConfirm('完全に削除しますか？この操作は元に戻せません。')) return;
      notes = notes.filter(n => n.id !== el.dataset.id);
      requestSave();
      renderTrash();
    });
  });
}

$('searchInput').addEventListener('input', (e) => {
  searchQuery = e.target.value.trim().toLowerCase();
  $('searchBarWrap').classList.toggle('hasText', !!e.target.value);
  if(searchQuery){
    listSectionEl.classList.add('open');

});
$('searchClearBtn').addEventListener('click', () => {

  $('searchBarWrap').classList.remove('hasText');

/* ---------- AI提案（Nグラム類似度で「似ている組み合わせ」を見つけるだけ。生成AIは使わない） ----------
   Fa側（H゜me/Fa）と、同じ考え方・同じデータを共有する想定。 */
function findAiSuggestPoolId(){
  const cat = categories.find(c => c.name === 'AI提案');
  return cat ? cat.id : null;
}
let aiSuggestedPairs = new Set();
let aiCurrentSuggestion = null;

function generateAiSuggestion(){
  if(aiCurrentSuggestion) return; // 既に1件、保留中
  const candidates = notes.filter(n => !n.deleted && noteFullText(n).trim().length > 0);
  let best = null, bestScore = 0;
  for(let i=0;i<candidates.length;i++){
    for(let j=i+1;j<candidates.length;j++){
      const a = candidates[i], b = candidates[j];
      const key = [a.id,b.id].sort().join('|');
      if(aiSuggestedPairs.has(key)) continue;
      const score = diceSimilarity(noteFullText(a), noteFullText(b));
      if(score > bestScore){ bestScore = score; best = {a,b,key}; }
    }
  }
  if(best && bestScore >= 0.08){
    aiCurrentSuggestion = best;
    aiSuggestedPairs.add(best.key);
    const ta = preview(best.a).title, tb = preview(best.b).title;
    $('aiSuggestCombo').textContent = `「${ta}」×「${tb}」`;
    $('aiSuggestTab').classList.add('blink');
  }
}
setInterval(generateAiSuggestion, 20000);

$('aiSuggestTab').addEventListener('click', () => {
  const panel = $('aiSuggestPanel');
  const open = panel.classList.toggle('open');
  $('aiSuggestTab').textContent = open ? '◁' : '▷';
  if(open) $('aiSuggestTab').classList.remove('blink');
});
$('aiSuggestSkip').addEventListener('click', () => {
  aiCurrentSuggestion = null;
  $('aiSuggestCombo').textContent = '思いつくものが見つかったら、ここに出ます';
});
$('aiSuggestAdopt').addEventListener('click', () => {
  if(!aiCurrentSuggestion) return;
  const { a, b } = aiCurrentSuggestion;
  const ta = preview(a).title, tb = preview(b).title;
  const poolId = findAiSuggestPoolId();
  const now = Date.now();
  const newNote = {
    id: 'ai_' + now.toString(36) + Math.random().toString(36).slice(2,5),
    tag: null, q:'idea', t: now,
    text: `「${ta}」×「${tb}」`,
    sub:'', type: null,
    title:'', purpose:'', concept:'', keywords:[],
    categoryId: poolId, categoryManual: true,
    hybrid:null, tentative:false, born:null,
    createdAt: new Date(now).toISOString(),
  };
  playConvergeEffect(poolId, () => {
    notes.push(newNote);
    requestSave();
    render();
  }, $('aiSuggestTab'));
  aiCurrentSuggestion = null;
  $('aiSuggestCombo').textContent = '思いつくものが見つかったら、ここに出ます';
  $('aiSuggestPanel').classList.remove('open');
  $('aiSuggestTab').textContent = '▷';
});

render();

/* ---------- 入場演出：下から上へ、シャボンが飛んでいく（読み込み時に一度だけ） ---------- */
(function bubbleIntro(){
  const wrap = document.getElementById('bubbleIntro');
  if(!wrap) return;
  const N = 7;
  for(let i=0;i<N;i++){
    const size = 14 + Math.random()*34;              // 14〜48px
    const left = 5 + Math.random()*90;                 // 画面幅の5〜95%
    const duration = 3.2 + Math.random()*2.2;           // 3.2〜5.4秒
    const delay = Math.random()*1.6;                    // 0〜1.6秒ずらして出す
    const drift = (Math.random()-0.5)*60;               // 少し左右に揺れながら昇る

    const bubble = document.createElement('div');
    bubble.style.cssText = `
      position:absolute; left:${left}%; bottom:-60px;
      width:${size}px; height:${size}px;
      animation:bubbleRise ${duration}s ease-in ${delay}s forwards;
      --drift:${drift}px;
    `;
    bubble.innerHTML = `
      <svg width="${size}" height="${size}" viewBox="0 0 40 40" style="overflow:visible">
        <defs>
          <radialGradient id="biIri${i}" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
            <stop offset="30%" stop-color="#ffe1f0" stop-opacity="0.32"/>
            <stop offset="55%" stop-color="#d9f2e6" stop-opacity="0.36"/>
            <stop offset="75%" stop-color="#d6e8ff" stop-opacity="0.42"/>
            <stop offset="100%" stop-color="#fff3c9" stop-opacity="0.5"/>
          </radialGradient>
          <radialGradient id="biEdge${i}" cx="50%" cy="50%" r="50%">
            <stop offset="65%" stop-color="#ffffff" stop-opacity="0"/>
            <stop offset="85%" stop-color="#ff9ecf" stop-opacity="0.6"/>
            <stop offset="92%" stop-color="#8fd8ff" stop-opacity="0.65"/>
            <stop offset="100%" stop-color="#c8ffcf" stop-opacity="0.7"/>
          </radialGradient>
        </defs>
        <circle cx="20" cy="20" r="17" fill="url(#biIri${i})" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.85"/>
        <circle cx="20" cy="20" r="17" fill="url(#biEdge${i})" style="mix-blend-mode:screen"/>
        <ellipse cx="14" cy="12" rx="4" ry="2.2" fill="#ffffff" opacity="0.9" transform="rotate(-25 14 12)"/>
      </svg>
    `;
    wrap.appendChild(bubble);
    bubble.addEventListener('animationend', () => bubble.remove());
  }
})();
</script>

<style>
@keyframes bubbleRise{
  0%   { transform: translate(0, 0);              opacity: 0; }
  8%   { opacity: 1; }
  100% { transform: translate(var(--drift), calc(-100vh - 80px)); opacity: 0; }
}
</style>
